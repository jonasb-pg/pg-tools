<!DOCTYPE html>
<html lang="de">
<head>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  /* Gestaltung nach dem Pretty Good Cockpit (Matchmaker): schwarze 2px-Linien, graue Fläche, Pink als Akzent */
  :root { --ink:#0a0a0a; --muted:#696967; --grau:#d2d2ce; --weiss:#ffffff; --pink:#ffbaf5; --pink-hell:#fff5ff; --linie:rgba(10,10,10,.15);
    --sans:sofiaPro, "Sofia Pro", Outfit, ui-sans-serif, system-ui, sans-serif; --mono:defaultSansMono, "DM Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:400 16px/1.5 var(--sans); color:var(--ink); background:var(--weiss); }
  .app { display:flex; min-height:100%; }

  /* Seitenleiste */
  aside { flex:none; width:292px; background:var(--weiss); border-right:2px solid var(--ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .marke-kopf { padding:16px; border-bottom:2px solid var(--ink); }
  .marke-kopf img { display:block; height:32px; }
  .marke-kopf .wort { font-weight:900; font-size:13px; line-height:1; letter-spacing:.3px; }
  .gross { text-transform:uppercase; font-weight:600; letter-spacing:.8px; }
  .marke-kopf .gross { color:var(--muted); margin-top:6px; display:block; }
  .nav { padding:12px; flex:1; overflow:auto; }
  .nav .sektion { color:var(--muted); font-size:14px; letter-spacing:.7px; padding:8px 12px; }
  .nav button { display:flex; align-items:center; gap:12px; width:100%; height:44px; margin-bottom:6px; padding:10px 12px; text-align:left;
    background:transparent; border:2px solid transparent; border-radius:4px; font:600 16px/1 var(--sans); letter-spacing:.8px; text-transform:uppercase; color:var(--ink); cursor:pointer; }
  .nav button:hover { border-color:var(--ink); background:transparent; }
  .nav button.an { background:var(--pink); border-color:var(--ink); border-left-width:6px; }
  .nav button .zahl { margin-left:auto; }
  .zahl { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 5px; border:2px solid var(--ink); border-radius:999px; background:var(--pink); font:600 13px/1 var(--sans); }
  .nav button.an .zahl { background:var(--weiss); }
  .fuss { padding:12px; border-top:2px solid var(--ink); }
  .fuss .info { font-size:14px; color:var(--muted); margin:0 0 10px; }
  .sprache { display:flex; border:2px solid var(--ink); border-radius:24px; overflow:hidden; }
  .sprache button { flex:1; height:36px; border:0; border-radius:0; background:var(--weiss); font:600 14px/1 var(--sans); letter-spacing:.7px; cursor:pointer; color:var(--ink); }
  .sprache button.an { background:var(--ink); color:var(--weiss); }

  /* Hauptbereich */
  .haupt { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--grau); }
  .top { background:var(--weiss); border-bottom:2px solid var(--ink); min-height:56px; padding:16px 32px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .top h1 { margin:0; font:900 20px/1 var(--sans); text-transform:uppercase; }
  .top span { color:var(--muted); }
  main { padding:24px 32px 48px; max-width:1180px; width:100%; }
  h2 { margin:0 0 12px; font:900 18px/1.2 var(--sans); text-transform:uppercase; }
  h3 { margin:0 0 12px; font:900 16px/1.2 var(--sans); text-transform:uppercase; letter-spacing:.3px; }
  .karte { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:20px; margin-bottom:16px; }
  .schritt { display:flex; gap:16px; }
  .schritt > .nr { flex:none; width:34px; height:34px; border-radius:50%; background:var(--pink); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; }
  .schritt > .inhalt { flex:1; min-width:0; }
  p { margin:0 0 12px; }
  a { color:var(--ink); font-weight:600; text-underline-offset:3px; }

  input[type=text], textarea, select { width:100%; font:600 17px/1.4 var(--sans); padding:10px 14px; border:2px solid var(--ink); border-radius:4px; background:var(--weiss); color:var(--ink); }
  input[type=text] { height:48px; }
  select { width:auto; height:40px; padding:4px 10px; font-size:15px; }
  textarea { resize:vertical; font-weight:400; }
  ::placeholder { color:#a3a3a0; font-weight:600; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
  #q { height:56px; font-size:20px; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--ink); flex:none; margin:1px 0 0; }
  input[type=file] { font:600 15px var(--sans); }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  label small, .klein { font-weight:400; font-size:14px; color:var(--muted); }
  label.haken { display:flex; gap:10px; align-items:flex-start; font-weight:600; }

  button { font:600 14px/1.2 var(--sans); letter-spacing:.7px; text-transform:uppercase; cursor:pointer; min-height:40px; padding:8px 18px; max-width:100%; white-space:normal; text-align:center; border:2px solid var(--ink); border-radius:24px; background:var(--weiss); color:var(--ink); }
  button:hover { background:var(--grau); }
  .tabelle td button { white-space:nowrap; letter-spacing:.3px; padding:8px 14px; }
  button.haupt-knopf { background:var(--pink); }
  button.haupt-knopf:hover { background:#f0a3e5; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .wahl { display:flex; flex-wrap:wrap; gap:8px; }
  .wahl button { border-radius:4px; }
  .wahl button.an { background:var(--ink); color:var(--weiss); }
  .zr-zeile { display:flex; align-items:center; gap:10px; margin:8px 0 14px; flex-wrap:wrap; }
  .zr-zeile button { min-width:36px; }
  tr.summe td { font-weight:600; border-top:2px solid var(--ink); }
  .kz-tab th, .kz-tab td { padding:10px 10px; font-size:13px; letter-spacing:.3px; }
  .kz-tab td { font-size:15px; }

  .tabelle { border:2px solid var(--ink); border-radius:4px; overflow:auto; background:var(--weiss); margin-top:12px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--grau); color:var(--muted); font:600 14px/1.2 var(--sans); letter-spacing:.7px; text-transform:uppercase; text-align:left; padding:12px 16px; border-bottom:2px solid var(--ink); white-space:nowrap; }
  td { padding:12px 16px; border-bottom:1px solid var(--linie); vertical-align:top; font-weight:600; }
  tr:last-child td { border-bottom:0; }
  td .klein { display:block; }
  .vbild { float:left; width:56px; height:56px; object-fit:cover; border:2px solid var(--ink); border-radius:4px; margin:0 10px 4px 0; background:#fff; }
  .mono { font:400 14px/1.4 var(--mono); color:var(--muted); }
  .zeile-neu td { background:var(--pink-hell); }
  .betrag { white-space:nowrap; font-size:18px; }
  .aufgabe { border:2px solid var(--ink); border-radius:4px; padding:12px 14px; margin:10px 0; background:var(--weiss); }
  .aufgabe.alt { border-color:#e08a00; }
  .aufgabe.sehr-alt { border-color:#c62828; border-width:3px; }
  .aufgabe .kopf { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; justify-content:space-between; margin:0 0 6px; }
  .aufgabe .frage { white-space:pre-wrap; margin:6px 0; }
  .aufgabe textarea { margin:6px 0; }
  .aufgabe .knoepfe { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .etikett.orange { background:#ffd8a8; } .etikett.rot { background:#c62828; color:#fff; }

  .meldung { padding:12px 16px; border:2px solid var(--ink); border-radius:4px; margin:12px 0; background:var(--weiss); }
  .meldung.warn { background:var(--pink-hell); }
  .meldung.ok { background:var(--pink); }
  .meldung.stop { background:var(--ink); color:var(--weiss); }
  /* Admin: Unterseiten, Kennzahlen-Kacheln (gleich wie im Analyse Tool) */
  .adm-reiter { margin:0 0 16px; }
  .kacheln { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin:0 0 16px; }
  .kachel { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:14px 16px; }
  .kachel .z { font:900 30px/1.1 var(--sans); margin:4px 0; }
  .kachel .n { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  .kachel .u { color:var(--muted); font-size:14px; }
  td.zahl-r, th.zahl-r { text-align:right; white-space:nowrap; }
  /* Feedback */
  .fb-auf { width:100%; margin-bottom:12px; background:var(--pink); }
  #fb { position:fixed; inset:0; z-index:45; background:rgba(10,10,10,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  #fb[hidden] { display:none; }
  #fb .karte { width:min(520px, 100%); margin:0; }
  #fb textarea { width:100%; resize:vertical; }
  .meldung ul { margin:6px 0 0; padding-left:20px; }
  .etikett { display:inline-block; padding:6px 8px; border-radius:4px; background:var(--grau); font:600 13px/1 var(--sans); letter-spacing:.7px; text-transform:uppercase; white-space:nowrap; }
  .etikett.hell { background:var(--pink); }

  .feld { display:grid; grid-template-columns:190px 1fr auto; gap:14px; align-items:start; padding:12px 0; border-bottom:1px solid var(--linie); }
  .feld:last-child { border-bottom:0; }
  .feld .name { color:var(--muted); font-size:14px; letter-spacing:.7px; text-transform:uppercase; font-weight:600; padding-top:2px; }
  .feld .wert { white-space:pre-wrap; word-break:break-word; font-weight:600; }
  .feld .wert small { display:block; white-space:normal; font-weight:400; font-size:14px; color:var(--muted); }
  .reihe { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .reihe > .breit { flex:1; min-width:220px; }
  .kopf { display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .kopf h2 { margin:0; }
  .still { color:var(--muted); font-size:14px; }
  ol.ablauf { margin:0 0 14px; padding-left:20px; color:var(--muted); font-size:14px; }
  details { margin-top:16px; border-top:1px solid var(--linie); padding-top:12px; }
  summary { cursor:pointer; font-weight:600; }
  #hinweis { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:30; max-width:min(680px, calc(100% - 32px)); padding:12px 44px 12px 16px;
    border:2px solid var(--ink); border-radius:4px; background:var(--weiss); font-weight:600; cursor:pointer; }
  #hinweis.ok { background:var(--pink); }
  #hinweis.stop { background:var(--ink); color:var(--weiss); }
  #hinweis::after { content:"×"; position:absolute; right:14px; top:8px; font-size:20px; }
  #dialog { position:fixed; inset:0; z-index:40; background:rgba(10,10,10,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  #dialog .box { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:24px; max-width:520px; width:100%; }
  #dialog p { font-weight:600; font-size:18px; margin:0 0 20px; }
  #dialog .reihe { justify-content:flex-end; }
  [hidden] { display:none !important; }
  #sperre { position:fixed; inset:0; z-index:50; cursor:progress; }
  #lade { z-index:51; position:fixed; right:20px; bottom:20px; background:var(--ink); color:var(--weiss); padding:10px 16px; border-radius:24px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; font-size:13px; }

  @media (max-width: 860px) {
    .app { display:block; }
    aside { width:auto; height:auto; position:static; border-right:0; border-bottom:2px solid var(--ink); }
    .nav { display:flex; flex-wrap:wrap; gap:6px; }
    .nav .sektion { display:none; }
    .nav button { width:auto; margin:0; }
    .fuss { display:flex; gap:12px; align-items:center; }
    .fuss .info { margin:0; flex:1; }
    main, .top { padding-left:16px; padding-right:16px; }
    .feld { grid-template-columns:1fr; gap:4px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marke-kopf">
      <img src="https://app.pretty-good.ch/logo/logo-pretty-good.svg" alt="Pretty Good" onerror="this.hidden=true;document.getElementById('wort').hidden=false">
      <div class="wort" id="wort" hidden>PRETTY<br>GOOD</div>
      <span class="gross">Ricardo</span>
    </div>
    <div class="nav">
      <div class="sektion gross" data-t="nav.sektion"></div>
      <button id="nav-listen" class="an" onclick="zeige('listen')"><span data-t="nav.listen"></span></button>
      <button id="nav-aufgaben" onclick="zeige('aufgaben')"><span data-t="nav.aufgaben"></span><span class="zahl" id="z-aufgaben" hidden></span></button>
      <button id="nav-verkauf" onclick="zeige('verkauf')"><span data-t="nav.verkauf"></span><span class="zahl" id="z-verkauf" hidden></span></button>
      <button id="nav-ueber" onclick="zeige('ueber')"><span data-t="nav.ueber"></span><span class="zahl" id="z-ueber" hidden></span></button>
      <button id="nav-retour" onclick="zeige('retour')"><span data-t="nav.retour"></span><span class="zahl" id="z-retour" hidden></span></button>
      <div class="sektion gross" id="nav-admin-sektion" data-t="nav.sektion2" hidden></div>
      <button id="nav-admin" onclick="zeige('admin')" hidden><span data-t="nav.admin"></span></button>
    </div>
    <div class="fuss">
      <button class="fb-auf" onclick="fbAuf()" data-t="fb.knopf"></button>
      <p class="info" id="zaehler"></p>
      <div class="sprache" role="group" aria-label="Sprache / Language">
        <button id="l-de" onclick="sprache('de')">DE</button>
        <button id="l-en" onclick="sprache('en')">EN</button>
      </div>
      <p class="info" id="version" style="margin:10px 0 0"></p>
    </div>
  </aside>

  <div class="haupt">
    <header class="top"><h1>Ricardo</h1><span class="gross" id="top-sub"></span></header>
    <main>

      <!-- ===================== LISTEN ===================== -->
      <section id="s-listen">
        <div class="karte" id="ana-karte" hidden>
          <div class="kopf"><h2 data-t="ana.titel"></h2><button onclick="ladeAnalyse()" data-t="aktualisieren"></button></div>
          <p class="still" style="margin:6px 0 0" data-t="ana.hilfe"></p>
          <div id="ana-liste"></div>
        </div>
        <div class="karte">
          <input type="text" id="q" data-tp="such.platz" autocomplete="off" autofocus>
          <p class="still" style="margin:10px 0 0" data-t="such.hilfe"></p>
          <div id="such-meldung"></div>
          <div id="treffer"></div>
          <p style="margin:12px 0 0"><a href="#" target="_self" onclick="freiZeigen();return false" data-t="frei.link"></a></p>
          <div id="frei" hidden>
            <p class="still" style="margin-top:10px" data-t="frei.text"></p>
            <label for="fr-name" data-t="frei.name"></label>
            <input type="text" id="fr-name" data-tp="frei.name.platz">
            <div class="reihe" style="align-items:flex-end">
              <div class="breit"><label for="fr-preis" data-t="frei.preis"></label><input type="text" id="fr-preis" inputmode="decimal"></div>
              <div class="breit"><label for="fr-neu"><span data-t="frei.neu"></span> <small data-t="frei.frei"></small></label><input type="text" id="fr-neu" inputmode="decimal"></div>
              <div class="breit"><label for="fr-ort"><span data-t="frei.ort"></span> <small data-t="frei.frei"></small></label><input type="text" id="fr-ort"></div>
            </div>
            <label for="fr-stich"><span data-t="frei.stich"></span> <small data-t="frei.frei"></small></label>
            <input type="text" id="fr-stich" data-tp="frei.stich.platz">
            <p style="margin:16px 0 0"><button class="haupt-knopf" onclick="freiAnlegen()" data-t="frei.anlegen"></button></p>
          </div>
        </div>

        <div id="arbeit" hidden>
          <div class="karte">
            <div class="kopf"><h2 id="a-titel"></h2><span class="etikett" id="a-status"></span></div>
            <p class="still" id="a-meta"></p>
            <div id="a-fehlt"></div>
          </div>

          <div class="karte schritt">
            <div class="nr">1</div>
            <div class="inhalt">
              <h3 data-t="s1.titel"></h3>
              <label><span data-t="s1.zustand"></span> <small data-t="s1.zustand.hilfe"></small></label>
              <div class="wahl" id="d-zustand"></div>
              <p class="still" id="d-ana" style="margin:6px 0 0" hidden></p>
              <div id="d-maengel-block">
                <label for="d-maengel"><span data-t="s1.maengel"></span> <small id="d-maengel-hinweis"></small></label>
                <textarea id="d-maengel" rows="2" data-tp="s1.maengel.platz"></textarea>
                <p class="still" style="margin:6px 0 0" data-t="s1.maengel.ki"></p>
              </div>
              <label><span data-t="s1.klasse"></span> <small data-t="s1.klasse.hilfe"></small></label>
              <p class="still" id="d-masse" style="margin:0 0 8px" hidden></p>
              <div class="wahl" id="d-klasse"></div>
              <label class="haken"><input type="checkbox" id="d-getestet"> <span data-t="s1.geprueft"></span></label>
              <p style="margin-top:16px"><button class="haupt-knopf" onclick="speichern()" data-t="s1.speichern"></button> <span class="still" id="d-versand"></span></p>

              <details id="buendel">
                <summary><span data-t="b.titel"></span> <span class="klein" data-t="b.hilfe"></span></summary>
                <div id="b-inhalt" style="margin-top:10px"></div>
                <div class="reihe">
                  <div class="breit"><input type="text" id="b-id" data-tp="b.platz"></div>
                  <button onclick="buendelPlus()" data-t="b.plus"></button>
                  <button onclick="buendelWeg()" data-t="b.weg"></button>
                </div>
                <p class="still" style="margin-top:10px" data-t="b.text"></p>
              </details>
            </div>
          </div>

          <div class="karte schritt">
            <div class="nr">2</div>
            <div class="inhalt">
              <h3 data-t="s2.titel"></h3>
              <p><button class="haupt-knopf" id="t-knopf" onclick="textErstellen()"></button> <span class="still" id="t-quelle"></span></p>
              <div id="t-geaendert" class="meldung warn" hidden></div>
              <label for="t-titel"><span data-t="s2.titelfeld"></span> <small id="t-zahl"></small></label>
              <input type="text" id="t-titel" maxlength="60">
              <label for="t-beschrieb"><span data-t="s2.beschrieb"></span> <small id="b-zahl"></small></label>
              <textarea id="t-beschrieb" rows="14"></textarea>
              <div id="t-en" class="meldung" hidden><strong data-t="s2.en"></strong><p class="still" id="t-en-hinweis" style="margin:4px 0 10px"></p><div id="t-en-text" style="white-space:pre-wrap"></div></div>
              <p class="still" style="margin-top:8px" data-t="s2.hilfe"></p>
              <p><button onclick="textSpeichern()" data-t="s2.speichern"></button></p>
            </div>
          </div>

          <div class="karte schritt">
            <div class="nr">3</div>
            <div class="inhalt">
              <h3 data-t="s3.titel"></h3>
              <div id="karte-zu" class="meldung warn" data-t="s3.zu"></div>
              <div id="karte-auf" hidden>
                <p><a href="https://www.ricardo.ch/de/list/" data-t="s3.link"></a></p>
                <div id="felder"></div>
              </div>
            </div>
          </div>

          <div class="karte schritt">
            <div class="nr">4</div>
            <div class="inhalt">
              <h3 data-t="s4.titel"></h3>
              <p><strong data-t="s4.pruefen"></strong></p>
              <div id="kontrolle"></div>
              <label for="r-link" data-t="s4.link"></label>
              <div class="reihe">
                <div class="breit"><input type="text" id="r-link" placeholder="https://www.ricardo.ch/de/a/..."></div>
                <div style="width:130px"><input type="number" id="r-tage" min="1" max="30" step="1" aria-label="Laufzeit Tage" title="Laufzeit in Tagen"></div>
                <button class="haupt-knopf" onclick="gelistet()" data-t="s4.speichern"></button>
              </div>
              <p class="still" style="margin-top:10px" data-t="s4.regal"></p>
              <p style="margin:18px 0 0"><button onclick="abbrechen()" data-t="s4.abbrechen"></button></p>
            </div>
          </div>
        </div>
      </section>

      <!-- ===================== ZU ERLEDIGEN ===================== -->
      <section id="s-aufgaben" hidden>
        <div class="karte">
          <div class="kopf"><h2 data-t="a.titel"></h2><button onclick="ladeAufgaben(true)" data-t="aktualisieren"></button></div>
          <p class="still" data-t="a.text"></p>
          <div id="a-kontrolle"></div>
          <div id="a-liste"></div>
        </div>
      </section>

      <!-- ===================== VERKÄUFE ===================== -->
      <section id="s-verkauf" hidden>
        <div class="karte">
          <h2 data-t="v.import"></h2>
          <p data-t="v.import.text"></p>
          <p><a href="https://www.ricardo.ch/de/my-ricardo/selling/orders" data-t="v.import.link"></a></p>
          <div class="reihe"><input type="file" id="v-datei" accept=".csv,text/csv"> <button class="haupt-knopf" onclick="importieren()" data-t="v.einlesen"></button></div>
          <div id="v-meldung"></div>
        </div>
        <div class="karte">
          <div class="kopf"><h2 data-t="v.packen"></h2><button onclick="ladeVerkaeufe()" data-t="aktualisieren"></button></div>

    if (z) h += '<h3 style="margin:20px 0 0">' + t('ad.verkaeufe') + '</h3>' + tab(['th.verkauf', 'th.stueck', 'th.kaeufer', 'th.status', ''], z);
    $('ad-liste').innerHTML = h || '<p class="still" style="margin-top:12px">' + t('ad.leer') + '</p>';
  }
  function adminFertig() { melde(t('ad.erledigt'), 'ok'); adminSuchen(); still('startDaten', [], function (s) { S = s; texte(); }); still('verkaeufe', [], function (v) { marke($('z-verkauf'), v.offen.length); }); }
  function adminLoesche(art, i) {
    if (art === 'l') { var l = AD.listings[i]; frage(t('ad.f.listing', l.id), function () { ruf('adminLoescheListing', [l.zeile, l.id], adminFertig); }); }
    else { var o = AD.verkaeufe[i]; frage(t('ad.f.verkauf', o.nr), function () { ruf('adminLoescheVerkauf', [o.zeile, o.nr], adminFertig); }); }
  }
  function zeichneEinst(l) {
    EINST = l;
    $('ad-ki').textContent = t(S.kiAktiv ? 'ad.ki.an' : 'ad.ki.aus'); $('ad-ki').className = 'meldung' + (S.kiAktiv ? '' : ' warn');
    $('ad-einst').innerHTML = l.map(function (e, i) {
      return '<div class="feld" style="grid-template-columns:230px 1fr"><div class="name">' + esc(e.name) + '</div><div>' + (e.name === 'Text-Anweisung' ? '<textarea id="es-' + i + '" rows="4">' + esc(e.wert) + '</textarea>' : '<input type="text" id="es-' + i + '" value="' + esc(e.wert) + '">') + '<small class="klein">' + esc(e.hilfe) + '</small></div></div>';
    }).join('');
  }
  function einstSpeichern() {
    var w = {};
    EINST.forEach(function (e, i) { var v = $('es-' + i).value; if (v !== e.wert) w[e.name] = v; });
    ruf('adminSpeichereEinstellungen', [w], function (l) { zeichneEinst(l); melde(t('ad.einst.gespeichert'), 'ok'); still('startDaten', [], function (s) { S = s; texte(); }); });
  }

  /* ---------- Laufende Angebote ---------- */
  function ladeUebersicht() { ruf('uebersicht', [], function (u) { UE = u; zaehler(u.aktiv, u.schwelle); zeichneUebersicht(); }); }
  function zeichneUebersicht() {
    if (!UE) return;
    marke($('z-ueber'), UE.liste.filter(function (x) { return x.abgelaufen; }).length);
    $('u-hinweis').textContent = t('u.hinweis', UE.laufzeit, UE.letzterImport || t('u.keiner'));
    var f = $('u-filter').value.trim().toLowerCase();
    var l = UE.liste.filter(function (x) { return !f || (x.id + ' ' + x.name).toLowerCase().indexOf(f) !== -1; });
    if (!l.length) { $('u-liste').innerHTML = '<p class="still" style="margin-top:12px">' + t('u.leer') + '</p>'; return; }
    var z = '';
    l.forEach(function (x) {
      var a = '';
      if (x.status === 'In Arbeit' || x.status === 'Bereit') a = '<button onclick="weiter(\'' + esc(x.id) + '\')">' + t('u.bearbeiten') + '</button>';
      if (x.status === 'Gelistet') a = '<button class="' + (x.abgelaufen ? 'haupt-knopf' : '') + '" onclick="unverkauft(\'' + esc(x.id) + '\')">' + t('u.unverkauft') + '</button>';
      var m = x.abgelaufen ? '<span class="etikett hell">' + t('u.abgelaufen') + '</span>' : '<span class="etikett">' + esc(st(x.status)) + '</span>';
      z += '<tr><td class="mono">' + esc(x.id) + (x.buendel ? '<br>+ ' + esc(x.buendel) : '') + '</td><td>' + esc(x.name) + (x.link ? '<span class="klein"><a href="' + esc(x.link) + '">' + t('u.angebot') + '</a></span>' : '') + '</td>' +
        '<td>' + m + '<span class="klein">' + t('u.seit', esc(x.seit)) + '</span></td><td>' + esc(x.ort) + (x.regal ? '<span class="klein">' + esc(x.regal) + '</span>' : '') + '</td><td>' + a + '</td></tr>';
    });
    $('u-liste').innerHTML = tab(['th.id', 'th.produkt', 'th.status', 'th.ort', ''], z);
  }
  function unverkauft(id) {
    frage(t('u.frage', id), function () { ruf('setzeStatus', [id, 'Unverkauft'], function (u) { UE = u; zaehler(u.aktiv, u.schwelle); zeichneUebersicht(); }); });
  }
  function weiter(id) { ruf('lade', [id], function (r) { zeige('listen'); oeffne(r); }); }

  /* ---------- Start ---------- */
  try { var gemerkt = localStorage.getItem('rt-lang'); if (gemerkt === 'en' || gemerkt === 'de') L = gemerkt; } catch (e) { /* Vorgabe aus der Adresse gilt */ }
  texte();
  /* Ohne Startdaten bleibt das Tool gesperrt und zeigt den Grund */
  lade(true);
  google.script.run.withSuccessHandler(function (s) {
    lade(false); S = s; texte(); $('q').focus();
    ladeAnalyse();
    still('verkaeufe', [], function (v) { marke($('z-verkauf'), v.offen.length); });
    still('retouren', [], function (r) { marke($('z-retour'), r.offen.length); });
    still('mailsJetzt', [], function (a) { AU = a; marke($('z-aufgaben'), a.anzahl); if (ANSICHT === 'aufgaben') zeichneAufgaben(); });
  }).withFailureHandler(function (e) {
    $('lade').hidden = true; melde(String(e.message || e).replace(/^Error:\s*/, ''), 'stop'); $('hinweis').onclick = null;
  }).api(L, 'startDaten', []);
</script>
