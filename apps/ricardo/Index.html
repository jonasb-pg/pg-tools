<!DOCTYPE html>
<html lang="de">
<head>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  /* Gestaltung nach dem Pretty Good Cockpit (Matchmaker): schwarze 2px-Linien, graue Fläche, Pink als Akzent */
  :root { --ink:#0a0a0a; --muted:#696967; --grau:#d2d2ce; --weiss:#ffffff; --pink:#ffbaf5; --pink-hell:#fff5ff; --linie:rgba(10,10,10,.15);
    --sans:sofiaPro, "Sofia Pro", Outfit, ui-sans-serif, system-ui, sans-serif; --mono:defaultSansMono, "DM Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:400 16px/1.5 var(--sans); color:var(--ink); background:var(--weiss); }
  .app { display:flex; min-height:100%; }

  /* Seitenleiste */
  aside { flex:none; width:292px; background:var(--weiss); border-right:2px solid var(--ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .marke-kopf { padding:16px; border-bottom:2px solid var(--ink); }
  .marke-kopf img { display:block; height:32px; }
  .marke-kopf .wort { font-weight:900; font-size:13px; line-height:1; letter-spacing:.3px; }
  .gross { text-transform:uppercase; font-weight:600; letter-spacing:.8px; }
  .marke-kopf .gross { color:var(--muted); margin-top:6px; display:block; }
  .nav { padding:12px; flex:1; overflow:auto; }
  .nav .sektion { color:var(--muted); font-size:14px; letter-spacing:.7px; padding:8px 12px; }
  .nav button { display:flex; align-items:center; gap:12px; width:100%; height:44px; margin-bottom:6px; padding:10px 12px; text-align:left;
    background:transparent; border:2px solid transparent; border-radius:4px; font:600 16px/1 var(--sans); letter-spacing:.8px; text-transform:uppercase; color:var(--ink); cursor:pointer; }
  .nav button:hover { border-color:var(--ink); background:transparent; }
  .nav button.an { background:var(--pink); border-color:var(--ink); border-left-width:6px; }
  .nav button .zahl { margin-left:auto; }
  .zahl { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 5px; border:2px solid var(--ink); border-radius:999px; background:var(--pink); font:600 13px/1 var(--sans); }
  .nav button.an .zahl { background:var(--weiss); }
  .fuss { padding:12px; border-top:2px solid var(--ink); }
  .fuss .info { font-size:14px; color:var(--muted); margin:0 0 10px; }
  .sprache { display:flex; border:2px solid var(--ink); border-radius:24px; overflow:hidden; }
  .sprache button { flex:1; height:36px; border:0; border-radius:0; background:var(--weiss); font:600 14px/1 var(--sans); letter-spacing:.7px; cursor:pointer; color:var(--ink); }
  .sprache button.an { background:var(--ink); color:var(--weiss); }

  /* Hauptbereich */
  .haupt { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--grau); }
  .top { background:var(--weiss); border-bottom:2px solid var(--ink); min-height:56px; padding:16px 32px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .top h1 { margin:0; font:900 20px/1 var(--sans); text-transform:uppercase; }
  .top span { color:var(--muted); }
  main { padding:24px 32px 48px; max-width:1180px; width:100%; }
  h2 { margin:0 0 12px; font:900 18px/1.2 var(--sans); text-transform:uppercase; }
  h3 { margin:0 0 12px; font:900 16px/1.2 var(--sans); text-transform:uppercase; letter-spacing:.3px; }
  .karte { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:20px; margin-bottom:16px; }
  .schritt { display:flex; gap:16px; }
  .schritt > .nr { flex:none; width:34px; height:34px; border-radius:50%; background:var(--pink); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; }
  .schritt > .inhalt { flex:1; min-width:0; }
  p { margin:0 0 12px; }
  a { color:var(--ink); font-weight:600; text-underline-offset:3px; }

  input[type=text], textarea, select { width:100%; font:600 17px/1.4 var(--sans); padding:10px 14px; border:2px solid var(--ink); border-radius:4px; background:var(--weiss); color:var(--ink); }
  input[type=text] { height:48px; }
  select { width:auto; height:40px; padding:4px 10px; font-size:15px; }
  textarea { resize:vertical; font-weight:400; }
  ::placeholder { color:#a3a3a0; font-weight:600; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
  #q { height:56px; font-size:20px; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--ink); flex:none; margin:1px 0 0; }
  input[type=file] { font:600 15px var(--sans); }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  label small, .klein { font-weight:400; font-size:14px; color:var(--muted); }
  label.haken { display:flex; gap:10px; align-items:flex-start; font-weight:600; }

  button { font:600 14px/1.2 var(--sans); letter-spacing:.7px; text-transform:uppercase; cursor:pointer; min-height:40px; padding:8px 18px; max-width:100%; white-space:normal; text-align:center; border:2px solid var(--ink); border-radius:24px; background:var(--weiss); color:var(--ink); }
  button:hover { background:var(--grau); }
  .tabelle td button { white-space:nowrap; letter-spacing:.3px; padding:8px 14px; }
  button.haupt-knopf { background:var(--pink); }
  button.haupt-knopf:hover { background:#f0a3e5; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .wahl { display:flex; flex-wrap:wrap; gap:8px; }
  .wahl button { border-radius:4px; }
  .wahl button.an { background:var(--ink); color:var(--weiss); }
  .zr-zeile { display:flex; align-items:center; gap:10px; margin:8px 0 14px; flex-wrap:wrap; }
  .zr-zeile button { min-width:36px; }
  tr.summe td { font-weight:600; border-top:2px solid var(--ink); }
  .kz-tab th, .kz-tab td { padding:10px 10px; font-size:13px; letter-spacing:.3px; }
  .kz-tab td { font-size:15px; }

  .tabelle { border:2px solid var(--ink); border-radius:4px; overflow:auto; background:var(--weiss); margin-top:12px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--grau); color:var(--muted); font:600 14px/1.2 var(--sans); letter-spacing:.7px; text-transform:uppercase; text-align:left; padding:12px 16px; border-bottom:2px solid var(--ink); white-space:nowrap; }
  td { padding:12px 16px; border-bottom:1px solid var(--linie); vertical-align:top; font-weight:600; }
  tr:last-child td { border-bottom:0; }
  td .klein { display:block; }
  .vbild { float:left; width:56px; height:56px; object-fit:cover; border:2px solid var(--ink); border-radius:4px; margin:0 10px 4px 0; background:#fff; }
  .mono { font:400 14px/1.4 var(--mono); color:var(--muted); }
  .zeile-neu td { background:var(--pink-hell); }
  .betrag { white-space:nowrap; font-size:18px; }
  .aufgabe { border:2px solid var(--ink); border-radius:4px; padding:12px 14px; margin:10px 0; background:var(--weiss); }
  .aufgabe.alt { border-color:#e08a00; }
  .aufgabe.sehr-alt { border-color:#c62828; border-width:3px; }
  .aufgabe .kopf { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; justify-content:space-between; margin:0 0 6px; }
  .aufgabe .frage { white-space:pre-wrap; margin:6px 0; }
  .aufgabe textarea { margin:6px 0; }
  .aufgabe .knoepfe { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .etikett.orange { background:#ffd8a8; } .etikett.rot { background:#c62828; color:#fff; }

  /* Abläufe */
  .nav button.flow { height:auto; min-height:44px; }
  .f-leiste { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
  .f-leiste button { border-radius:24px; background:var(--weiss); }
  .f-leiste button.an { background:var(--pink); font-weight:900; }
  .f-leiste .zahl { margin-left:4px; }
  .f-boxen { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin:12px 0 4px; }
  .f-box { border:2px solid var(--ink); border-radius:4px; padding:12px 16px; background:var(--weiss); font-size:17px; }
  .f-box.rosa { background:var(--pink); }
  .f-label { font-size:13px; font-weight:900; letter-spacing:.7px; text-transform:uppercase; margin-bottom:4px; }
  .f-zeile { display:flex; align-items:center; gap:14px; flex-wrap:wrap; border:2px solid var(--ink); border-radius:4px; padding:12px 14px; margin:10px 0; background:var(--weiss); }
  .f-zeile .f-text { flex:1; min-width:240px; }
  .f-zeile .f-text strong { display:block; font-size:17px; }
  .f-zeile .f-text .klein, .f-zeile .f-text .etikett { display:inline-block; margin-top:4px; }
  .f-zeile .knoepfe { display:flex; gap:8px; flex-wrap:wrap; }
  .f-weiter { display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:16px; border-top:1px solid var(--linie); }
  button.dunkel { background:var(--ink); color:var(--weiss); }
  button.dunkel:hover { background:#333; }
  .f-tun { display:flex; align-items:center; gap:16px; flex-wrap:wrap; border:2px solid var(--ink); border-radius:4px; padding:14px 18px; margin:14px 0; background:var(--weiss); font-size:17px; }
  .f-tun.rosa { background:var(--pink); }
  .f-tun .f-tun-text { flex:1; min-width:240px; }
  .f-tun .klein { display:block; margin-top:6px; }
  .f-wahl { display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }
  .f-wahl button { height:56px; padding:0 24px; font-size:17px; }
  .f-wahl button.an { background:var(--pink); font-weight:900; }
  .f-fall { margin-bottom:6px; }
  .f-fall strong { display:block; font-size:15px; }
  .f-bild { max-width:220px; max-height:220px; border:2px solid var(--ink); border-radius:4px; display:block; margin:10px 0; }
  .f-leiste button[disabled] { opacity:.55; cursor:default; }
  .f-leiste button.an[disabled] { opacity:1; }
  .f-weiter .knoepfe { display:flex; gap:10px; flex-wrap:wrap; }
  #f-schritte .nur-alt, #f-schritte .schritt > .nr, #f-schritte #a-kopf h2 + .etikett { display:none; }
  #f-schritte .karte .karte { border:0; box-shadow:none; padding:0; margin:10px 0 0; }
  @media (max-width: 860px) { .f-boxen { grid-template-columns:1fr; } }
  .zeile3 { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; margin:6px 0 10px; font-size:15px; }
  .zeile3 .w { color:var(--muted); font-size:13px; letter-spacing:.7px; text-transform:uppercase; font-weight:600; padding-top:2px; }
  .ricardo-zeile { display:flex; flex-wrap:wrap; gap:10px; align-items:center; border:2px solid var(--ink); border-radius:4px; background:var(--pink-hell); padding:10px 12px; margin:10px 0; }
  .ricardo-zeile .text { flex:1; min-width:200px; }
  .schritt.fertig { opacity:.55; }
  .schritt .erledigt-haken { margin-top:14px; border-top:1px solid var(--linie); padding-top:10px; }
  .fortschritt { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .fortschritt span { width:28px; height:8px; border-radius:4px; background:var(--grau); border:1px solid var(--ink); }
  .fortschritt span.an { background:var(--ink); }
  .meldung { padding:12px 16px; border:2px solid var(--ink); border-radius:4px; margin:12px 0; background:var(--weiss); }
  .meldung.warn { background:var(--pink-hell); }
  .meldung.ok { background:var(--pink); }
  .meldung.stop { background:var(--ink); color:var(--weiss); }
  /* Admin: Unterseiten, Kennzahlen-Kacheln (gleich wie im Analyse Tool) */
  .adm-reiter { margin:0 0 16px; }
  .kacheln { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin:0 0 16px; }
  .kachel { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:14px 16px; }
  .kachel .z { font:900 30px/1.1 var(--sans); margin:4px 0; }
  .kachel .n { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  .kachel .u { color:var(--muted); font-size:14px; }
  td.zahl-r, th.zahl-r { text-align:right; white-space:nowrap; }
  /* Feedback */
  .fb-auf { width:100%; margin-bottom:12px; background:var(--pink); }
  #fb { position:fixed; inset:0; z-index:45; background:rgba(10,10,10,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  #fb[hidden] { display:none; }
  #fb .karte { width:min(520px, 100%); margin:0; }
  #fb textarea { width:100%; resize:vertical; }
  .meldung ul { margin:6px 0 0; padding-left:20px; }
  .etikett { display:inline-block; padding:6px 8px; border-radius:4px; background:var(--grau); font:600 13px/1 var(--sans); letter-spacing:.7px; text-transform:uppercase; white-space:nowrap; }
  .etikett.hell { background:var(--pink); }

  .feld { display:grid; grid-template-columns:190px 1fr auto; gap:14px; align-items:start; padding:12px 0; border-bottom:1px solid var(--linie); }
  .feld:last-child { border-bottom:0; }
  .feld .name { color:var(--muted); font-size:14px; letter-spacing:.7px; text-transform:uppercase; font-weight:600; padding-top:2px; }
  .feld .wert { white-space:pre-wrap; word-break:break-word; font-weight:600; }
  .feld .wert small { display:block; white-space:normal; font-weight:400; font-size:14px; color:var(--muted); }
  .reihe { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .reihe > .breit { flex:1; min-width:220px; }
  .kopf { display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .kopf h2 { margin:0; }
  .still { color:var(--muted); font-size:14px; }
  ol.ablauf { margin:0 0 14px; padding-left:20px; color:var(--muted); font-size:14px; }
  details { margin-top:16px; border-top:1px solid var(--linie); padding-top:12px; }
  summary { cursor:pointer; font-weight:600; }
  #hinweis { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:30; max-width:min(680px, calc(100% - 32px)); padding:12px 44px 12px 16px;
    border:2px solid var(--ink); border-radius:4px; background:var(--weiss); font-weight:600; cursor:pointer; }
  #hinweis.ok { background:var(--pink); }
  #hinweis.stop { background:var(--ink); color:var(--weiss); }
  #hinweis::after { content:"×"; position:absolute; right:14px; top:8px; font-size:20px; }
  #dialog { position:fixed; inset:0; z-index:40; background:rgba(10,10,10,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  #dialog .box { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:24px; max-width:520px; width:100%; }
  #dialog p { font-weight:600; font-size:18px; margin:0 0 20px; }
  #dialog .reihe { justify-content:flex-end; }
  [hidden] { display:none !important; }
  #sperre { position:fixed; inset:0; z-index:50; cursor:progress; }
  /* Tempo 19.10.2026: Speichern im Hintergrund. Anzeige unten links, Fehler mit «Nochmals» */
  #schlange { z-index:40; position:fixed; left:20px; bottom:20px; background:var(--weiss); color:var(--ink); border:1.5px solid var(--ink); padding:8px 14px; border-radius:24px; font-size:13px; font-weight:600; }
  #schlange-fehler { z-index:45; position:fixed; left:50%; bottom:20px; transform:translateX(-50%); max-width:min(680px, calc(100% - 32px)); background:var(--ink); color:var(--weiss); padding:14px 16px; border-radius:6px; }
  #schlange-fehler .knoepfe { margin-top:10px; display:flex; gap:8px; }
  #schlange-fehler button { background:var(--weiss); color:var(--ink); }
  #lade { z-index:51; position:fixed; right:20px; bottom:20px; background:var(--ink); color:var(--weiss); padding:10px 16px; border-radius:24px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; font-size:13px; }

  @media (max-width: 860px) {
    .app { display:block; }
    aside { width:auto; height:auto; position:static; border-right:0; border-bottom:2px solid var(--ink); }
    .nav { display:flex; flex-wrap:wrap; gap:6px; }
    .nav .sektion { display:none; }
    .nav button { width:auto; margin:0; }
    .fuss { display:flex; gap:12px; align-items:center; }
    .fuss .info { margin:0; flex:1; }
    main, .top { padding-left:16px; padding-right:16px; }
    .feld { grid-template-columns:1fr; gap:4px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marke-kopf">
      <img src="https://app.pretty-good.ch/logo/logo-pretty-good.svg" alt="Pretty Good" onerror="this.hidden=true;document.getElementById('wort').hidden=false">
      <div class="wort" id="wort" hidden>PRETTY<br>GOOD</div>
      <span class="gross">Ricardo</span>
    </div>
    <div class="nav">
      <div class="sektion gross" data-t="nav.ablaeufe"></div>
      <button id="nav-f-taeglich" class="flow" onclick="ablaufStarten('taeglich')"><span data-t="f.taeglich"></span><span class="zahl" id="z-f-taeglich" hidden></span></button>
      <button id="nav-f-schicht1" class="flow" onclick="ablaufStarten('schicht1')"><span data-t="f.schicht1"></span><span class="zahl" id="z-f-schicht1" hidden></span></button>
      <button id="nav-f-schicht2" class="flow" onclick="ablaufStarten('schicht2')"><span data-t="f.schicht2"></span><span class="zahl" id="z-f-schicht2" hidden></span></button>
      <button id="nav-f-schicht3" class="flow" onclick="ablaufStarten('schicht3')"><span data-t="f.schicht3"></span><span class="zahl" id="z-f-schicht3" hidden></span></button>
      <div class="sektion gross" data-t="nav.sektion" hidden></div>
      <button id="nav-listen" hidden onclick="zeige('listen')"><span data-t="nav.listen"></span></button>
      <button id="nav-aufgaben" hidden onclick="zeige('aufgaben')"><span data-t="nav.aufgaben"></span><span class="zahl" id="z-aufgaben" hidden></span></button>
      <button id="nav-verkauf" hidden onclick="zeige('verkauf')"><span data-t="nav.verkauf"></span><span class="zahl" id="z-verkauf" hidden></span></button>
      <div class="sektion gross" id="nav-admin-sektion" data-t="nav.sektion2"></div>
      <button id="nav-retour" onclick="zeige('retour')"><span data-t="nav.retour"></span><span class="zahl" id="z-retour" hidden></span></button>
      <button id="nav-ueber" onclick="zeige('ueber')"><span data-t="nav.ueber"></span><span class="zahl" id="z-ueber" hidden></span></button>
      <button id="nav-admin" onclick="zeige('admin')" hidden><span data-t="nav.admin"></span></button>
    </div>
    <div class="fuss">
      <button class="fb-auf" onclick="fbAuf()" data-t="fb.knopf"></button>
      <p class="info" id="zaehler"></p>
      <div class="sprache" role="group" aria-label="Sprache / Language">
        <button id="l-de" onclick="sprache('de')">DE</button>
        <button id="l-en" onclick="sprache('en')">EN</button>
      </div>
      <p class="info" id="version" style="margin:10px 0 0"></p>
    </div>
  </aside>

  <div class="haupt">
    <header class="top"><h1>Ricardo</h1><span class="gross" id="top-sub"></span></header>
    <main>

      <!-- ===================== LISTEN ===================== -->
      <section id="s-listen" hidden>
        <div class="karte" id="ana-karte" hidden>
          <div class="kopf"><h2 data-t="ana.titel"></h2><button onclick="ladeAnalyse()" data-t="aktualisieren"></button></div>
          <p class="still" style="margin:6px 0 0" data-t="ana.hilfe"></p>
          <div id="ana-liste"></div>
        </div>
        <div class="karte" id="such-karte">
          <input type="text" id="q" data-tp="such.platz" autocomplete="off" autofocus>
          <p class="still" style="margin:10px 0 0" data-t="such.hilfe"></p>
          <div id="such-meldung"></div>
          <div id="treffer"></div>
          <p style="margin:12px 0 0"><a href="#" target="_self" onclick="freiZeigen();return false" data-t="frei.link"></a></p>
          <div id="frei" hidden>
            <p class="still" style="margin-top:10px" data-t="frei.text"></p>
            <label for="fr-name" data-t="frei.name"></label>
            <input type="text" id="fr-name" data-tp="frei.name.platz">
            <div class="reihe" style="align-items:flex-end">
              <div class="breit"><label for="fr-preis" data-t="frei.preis"></label><input type="text" id="fr-preis" inputmode="decimal"></div>
              <div class="breit"><label for="fr-neu"><span data-t="frei.neu"></span> <small data-t="frei.frei"></small></label><input type="text" id="fr-neu" inputmode="decimal"></div>
              <div class="breit"><label for="fr-ort"><span data-t="frei.ort"></span> <small data-t="frei.frei"></small></label><input type="text" id="fr-ort"></div>
            </div>
            <label for="fr-stich"><span data-t="frei.stich"></span> <small data-t="frei.frei"></small></label>
            <input type="text" id="fr-stich" data-tp="frei.stich.platz">
            <p style="margin:16px 0 0"><button class="haupt-knopf" onclick="freiAnlegen()" data-t="frei.anlegen"></button></p>
          </div>
        </div>

        <div id="arbeit" hidden>
          <div class="karte" id="a-kopf">
            <div class="kopf"><h2 id="a-titel"></h2><span class="etikett" id="a-status"></span></div>
            <p class="still" id="a-meta"></p>

    if (f.start) { f.start(); return; }   // Listing: lädt das Stück, danach öffnet oeffne() den Fall
    FALL = f; SCHR = 0; zeichneAblauf(); window.scrollTo(0, 0);
  }
  function geheSchritt(i) { SCHR = i; zeichneAblauf(); window.scrollTo(0, 0); }
  function zurListe() { listingVerlassen(); FALL = null; FERTIG = false; R = null; einbauLoesen(); ladeAblauf(); if (FA === 'schicht1') ladeAnalyse(); window.scrollTo(0, 0); }
  /* Fertig: sofort der nächste Fall. Was gespeichert wird, läuft im Hintergrund; danach lädt der Ablauf still neu. */
  function fallFertig() {
    if (FALL) { SEQ++; ERLEDIGT[FALL.key] = PEND[FALL.key] ? 'offen' : SEQ; }
    FERTIG = true; R = null; zeichneAblauf(); window.scrollTo(0, 0);
    ablaufStill(FA); if (FA === 'schicht1') ladeAnalyse();
  }
  function schritteVon(f) { return f.listing ? listingSchritte() : f.schritte(f); }
  function marken(l) { marke($('z-f-' + FA), l.length); }
  function zeichneAblauf() {
    if (!F || F.art !== FA) return;
    einbauLoesen();
    var l = faelle(); marken(l);
    var h = '';
    if (FALL && FERTIG) {
      var rest = l.filter(function (x) { return x.key !== FALL.key; });
      h = '<div class="karte f-fertig"><h2>✓ ' + t('g.fertig') + ': ' + esc(FALL.titel) + '</h2>'
        + (rest.length ? '<p class="still">' + t('g.offen', rest.length) + '</p><div class="f-weiter"><button onclick="zurListe()">' + t('g.liste') + '</button><button class="dunkel" onclick="fallStarten(\'' + esc(rest[0].key) + '\')">' + t('g.naechstes', esc(rest[0].titel)) + ' →</button></div>'
          : '<p>' + t('g.allesfertig') + '</p><div class="f-weiter"><button onclick="zurListe()">' + t('g.liste') + '</button><span></span></div>') + '</div>';
      $('f-leiste').innerHTML = ''; $('f-schritte').innerHTML = h; return;
    }
    if (FALL) {
      var s = schritteVon(FALL); if (SCHR >= s.length) SCHR = s.length - 1;
      var x = s[SCHR];
      $('f-leiste').innerHTML = '<button onclick="zurListe()">← ' + t('g.liste') + '</button>' + s.map(function (y, i) {
        return '<button class="' + (i === SCHR ? 'an' : '') + '"' + (i < SCHR ? ' onclick="geheSchritt(' + i + ')"' : ' disabled') + '>' + (i < SCHR ? '✓ ' : (i + 1) + ' ') + esc(y.titel) + '</button>';
      }).join('');
      h = '<div class="karte"><div class="f-fall"><strong>' + esc(FALL.titel) + '</strong><span class="still">' + (FALL.info || '') + '</span></div><h2>' + esc(x.titel) + '</h2>' + x.html
        + '<div class="f-weiter">' + (SCHR > 0 ? '<button onclick="geheSchritt(' + (SCHR - 1) + ')">← ' + t('g.zurueck') + '</button>' : '<span></span>')
        + '<div class="knoepfe">' + (x.neben ? '<button id="f-neben">' + esc(x.neben[0]) + '</button>' : '') + (x.aktion ? '<button class="dunkel" id="f-aktion">' + esc(x.aktion[0]) + ' →</button>' : '') + '</div></div></div>';
      $('f-schritte').innerHTML = h;
      if (x.aktion) $('f-aktion').onclick = x.aktion[1];
      if (x.neben) $('f-neben').onclick = x.neben[1];
      einbauen();
      if (x.start) x.start();
      return;
    }
    $('f-leiste').innerHTML = '';
    var vorher = { taeglich: vorherTaeglich, schicht1: vorherListing, schicht2: vorherPacken, schicht3: function () { return ''; } }[FA]();
    var nachher = { schicht1: nachherListing, schicht3: nachherVersenden }[FA];
    h = vorher + '<div class="karte"><div class="kopf"><h2>' + t('f.' + FA) + '</h2><span class="still">' + t('g.offen', l.length) + '</span></div>'
      + (l.length ? l.map(function (f) {
        return '<div class="f-zeile f-eintrag">' + (f.bild ? '<img class="vbild" src="' + esc(f.bild) + '" alt="">' : '') + '<div class="f-text"><strong>' + esc(f.titel) + '</strong><span class="still">' + (f.info || '') + '</span>'
          + (f.tag ? ' <span class="etikett ' + (f.tagKlasse || '') + '">' + esc(f.tag) + '</span>' : '') + '</div><div class="knoepfe"><button class="haupt-knopf" onclick="fallStarten(\'' + esc(f.key) + '\')">' + t('g.start') + ' →</button></div></div>';
      }).join('') : '<p class="still">' + t('g.leer') + '</p>') + '</div>' + (nachher ? nachher() : '');
    $('f-schritte').innerHTML = h;
    einbauen();
  }
  /* Listing: oeffne() meldet ein geladenes Stück hier an, egal ob aus der Liste, der Suche oder «ohne Analyse» */
  var LISTING_OFFEN = '';
  /* Listing verlassen ohne «Gelistet»: Stück fällt zurück (Server prüft, ob es verworfen werden darf) */
  function listingVerlassen() { LISTING_OFFEN = ''; }   // 21.10.2026: Verlassen verwirft nichts mehr, das Listing bleibt offen bis «Gelistet»
  function listingFall(r) {
    if (LISTING_OFFEN && LISTING_OFFEN !== r.id) listingVerlassen();
    LISTING_OFFEN = r.id;
    FALL = { key: 'l' + r.id, titel: r.bezeichnung, info: esc(r.id) + (r.lagerort ? ' · ' + esc(r.lagerort) : ''), listing: true };
    FERTIG = false; SCHR = 0; zeichneAblauf(); window.scrollTo(0, 0);
  }

  /* Bank-Export, Etikette, Kopieren: unverändert */
  function xlsxLaden(ok) {
    if (window.XLSX) { ok(); return; }
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ok; sc.onerror = function () { lade(false); melde(t('f.t1.bibliothek'), 'stop'); };
    document.head.appendChild(sc);
  }
  function zahlAus(x) { if (typeof x === 'number') return x; var s = String(x == null ? '' : x).replace(/['’\s]/g, ''); if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); return Number(s) || 0; }
  function datumAus(x) {
    if (x instanceof Date) return tagIso(x);
    if (typeof x === 'number' && window.XLSX) { var d = XLSX.SSF.parse_date_code(x); return d ? d.y + '-' + ('0' + d.m).slice(-2) + '-' + ('0' + d.d).slice(-2) : ''; }
    var m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(String(x || '').trim()) || null;
    if (m) return m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
    m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(x || '').trim());
    return m ? m[0] : '';
  }
  function bankZeilen(rows) {
    var k = -1, h = null;
    for (var i = 0; i < Math.min(rows.length, 30); i++) {
      var r = (rows[i] || []).map(function (x) { return String(x == null ? '' : x).trim(); });
      if (r.indexOf('Buchungstext') !== -1 && r.indexOf('Gutschrift') !== -1) { k = i; h = r; break; }
    }
    if (k < 0) return null;
    var c = function (n) { return h.indexOf(n); }, cd = c('Buchungsdatum') > -1 ? c('Buchungsdatum') : c('Valutadatum'), out = [];
    rows.slice(k + 1).forEach(function (r) {
      var b = zahlAus(r[c('Gutschrift')]);
      if (!(b > 0)) return;
      out.push({ datum: datumAus(r[cd]), text: String(r[c('Buchungstext')] || '').slice(0, 500), betrag: b, auftrag: c('Auftragsnummer') > -1 ? String(r[c('Auftragsnummer')] || '') : '' });
    });
    return out;
  }
  function bankLesen() {
    var d = $('f-bank').files[0];
    if (!d) { melde(t('v.datei.fehlt'), 'stop'); return; }
    var weiter = function (rows) {
      var z = bankZeilen(rows);
      if (!z) { lade(false); melde(t('f.t1.format'), 'stop'); return; }
      lade(false);
      ruf('bankAbgleich', [z], function (r) { BANK = r; $('f-bank-erg').innerHTML = bankHtml(); });
    };
    lade(true);
    var leser = new FileReader();
    leser.onerror = function () { lade(false); melde(t('v.datei.fehler'), 'stop'); };
    if (/\.csv$/i.test(d.name)) {
      leser.onload = function () {
        var text = String(leser.result), trenner = (text.split('\n')[0].match(/;/g) || []).length >= (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
        weiter(text.split(/\r?\n/).map(function (z) { return csvZeile(z, trenner); }));
      };
      leser.readAsText(d, 'UTF-8');
    } else {
      leser.onload = function () { xlsxLaden(function () {
        try { var wb = XLSX.read(new Uint8Array(leser.result), { type: 'array', cellDates: true }); weiter(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true })); }
        catch (e) { lade(false); melde(t('v.datei.fehler'), 'stop'); }
      }); };
      leser.readAsArrayBuffer(d);
    }
  }
  function csvZeile(z, tr) {
    var out = [], f = '', q = false;
    for (var i = 0; i < z.length; i++) {
      var ch = z[i];
      if (q) { if (ch === '"' && z[i + 1] === '"') { f += '"'; i++; } else if (ch === '"') q = false; else f += ch; }
      else if (ch === '"') q = true; else if (ch === tr) { out.push(f); f = ''; } else f += ch;
    }
    out.push(f); return out;
  }
  function bankHtml() {
    if (!BANK) return '';
    var r = BANK, h = '<div class="meldung">' + t('f.t1.erg', r.gutschriften, r.offen, r.sicher.length, r.unsicher.length, r.schonErfasst) + '</div>';
    if (!r.sicher.length && !r.unsicher.length) return h + '<p class="still">' + t('f.t1.keine') + '</p>';
    var zeile = function (o, i, an) {
      return '<label class="haken aufgabe" style="margin:8px 0"><input type="checkbox" class="bank-wahl" data-i="' + i + '" ' + (an ? 'checked' : '') + '> <span><strong>' + esc(o.titel) + '</strong> <span class="still">'
        + (o.pgId ? esc(o.pgId) + ' · ' : '') + t('v.nr', esc(o.nr)) + ' · ' + esc(o.name || o.kaeufer) + ' · CHF ' + esc(o.total) + '</span><br><span class="klein">'
        + esc(tagCh(o.bank.datum, true)) + ' · CHF ' + esc(o.bank.betrag) + ' · ' + esc(o.grund) + '<br>' + esc(o.bank.text) + '</span></span></label>';
    };
    var alle = r.sicher.concat(r.unsicher);
    if (r.sicher.length) h += '<h3 style="margin-top:14px">' + t('f.t1.sicher') + '</h3>' + r.sicher.map(function (o, i) { return zeile(o, i, true); }).join('');
    if (r.unsicher.length) h += '<h3 style="margin-top:14px">' + t('f.t1.unsicher') + '</h3>' + r.unsicher.map(function (o, i) { return zeile(o, r.sicher.length + i, false); }).join('');
    BANK.alle = alle;
    return h + '<p style="margin-top:12px"><button class="haupt-knopf" onclick="bankErfassen()">' + t('f.t1.erfassen') + '</button></p>';
  }
  function bankErfassen() {
    var wahl = Array.prototype.filter.call(document.querySelectorAll('.bank-wahl'), function (x) { return x.checked; }).map(function (x) { var o = BANK.alle[Number(x.getAttribute('data-i'))]; return { nr: o.nr, bank: o.bank }; });
    if (!wahl.length) { melde(t('f.t1.keine'), 'stop'); return; }
    ruf('bankBestaetigen', [wahl], function (f) { BANK = null; F = f; zeichneAblauf(); melde(t('f.t1.erfassen') + ': ' + wahl.length, 'ok'); });
  }
  function etikette(nr) {
    var o = F.verkaeufe.offen.filter(function (x) { return x.nr === nr; })[0];
    var los = function () {
      ruf('etikette', [nr], function (e) {
        var bin = atob(e.pdf), bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        var u = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        if (o) { o.sendung = e.sendung; o.pdfUrl = u; }
        if (FALL && FALL.o && FALL.o.nr === nr) { FALL.o.sendung = e.sendung; FALL.o.pdfUrl = u; }
        melde(t('g.p.etikette.da', e.sendung), 'ok');
        window.open(u, '_blank');
        zeichneAblauf();
      });
    };
    if (o && o.sendung) frage(t('f.s2.etikette.frage', o.pgId || nr, o.sendung), los); else los();
  }
  function kopiereText(text) {
    var fertig = function () { melde(t('kopiert'), 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(fertig, function () { melde(text, 'ok'); }); else melde(text, 'ok');
  }

  /* ---------- Start ---------- */
  try { var gemerkt = localStorage.getItem('rt-lang'); if (gemerkt === 'en' || gemerkt === 'de') L = gemerkt; } catch (e) { /* Vorgabe aus der Adresse gilt */ }
  texte();
  /* Ohne Startdaten bleibt das Tool gesperrt und zeigt den Grund */
  lade(true);
  google.script.run.withSuccessHandler(function (s) {
    lade(false); S = s; texte(); ablaufStarten('taeglich');
    ladeAnalyse();
    vorladen(['schicht1', 'schicht2', 'schicht3']);
    /* Tempo 19.10.2026: die Marken in einem Aufruf (statt verkaeufe, retouren und ein zweites ablauf('taeglich')); «Täglich» setzt seine Marke selbst */
    zaehlerLaden();
    still('mailsJetzt', [], function (a) { AU = a; marke($('z-aufgaben'), a.anzahl); if (ANSICHT === 'aufgaben') zeichneAufgaben(); });
  }).withFailureHandler(function (e) {
    $('lade').hidden = true; melde(String(e.message || e).replace(/^Error:\s*/, ''), 'stop'); $('hinweis').onclick = null;
  }).api(L, 'startDaten', []);
