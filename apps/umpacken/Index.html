<!DOCTYPE html>
<html lang="de">
<head>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  /* Gestaltung wie Ricardo und Analyse Tool: schwarze 2px-Linien, graue Fläche, Pink als Akzent */
  :root { --ink:#0a0a0a; --muted:#696967; --grau:#d2d2ce; --weiss:#ffffff; --pink:#ffbaf5; --pink-hell:#fff5ff; --gruen:#c8f0cf; --rot:#ffcfcf; --gelb:#fff2b3;
    --sans:"Sofia Pro", Outfit, ui-sans-serif, system-ui, sans-serif; --mono:"DM Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  body { margin:0; font:400 16px/1.5 var(--sans); color:var(--ink); background:var(--grau); }
  header { background:var(--weiss); border-bottom:2px solid var(--ink); padding:12px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font:900 20px/1 var(--sans); text-transform:uppercase; }
  header .wo { color:var(--muted); font-weight:600; }
  header .rechts { margin-left:auto; display:flex; gap:10px; align-items:center; }
  main { padding:20px 24px 60px; max-width:1200px; margin:0 auto; }
  h2 { margin:0 0 12px; font:900 18px/1.2 var(--sans); text-transform:uppercase; }
  h3 { margin:0 0 10px; font:900 15px/1.2 var(--sans); text-transform:uppercase; letter-spacing:.3px; }
  .karte { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:18px; margin-bottom:16px; }
  p { margin:0 0 10px; } .still { color:var(--muted); }
  a { color:var(--ink); font-weight:600; }
  button, .knopf { font:600 15px/1 var(--sans); letter-spacing:.6px; text-transform:uppercase; padding:11px 16px; border:2px solid var(--ink); border-radius:24px; background:var(--weiss); color:var(--ink); cursor:pointer; }
  button.pink { background:var(--pink); } button.schwarz { background:var(--ink); color:var(--weiss); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.link { border:0; background:none; padding:0; text-decoration:underline; text-transform:none; letter-spacing:0; border-radius:0; }
  button.klein { padding:6px 10px; font-size:12px; }
  input[type=text], input[type=number], textarea, select { font:600 16px/1.3 var(--sans); padding:9px 12px; border:2px solid var(--ink); border-radius:4px; background:var(--weiss); color:var(--ink); }
  input[type=text], textarea { width:100%; } textarea { font:400 14px/1.4 var(--mono); min-height:160px; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
  label { font-weight:600; display:block; margin:10px 0 4px; }
  .reihe { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .meldung { border:2px solid var(--ink); border-radius:4px; padding:12px 14px; margin:10px 0; background:var(--pink-hell); }
  .meldung.ok { background:var(--gruen); } .meldung.stop { background:var(--rot); } .meldung.warn { background:var(--gelb); }
  table { border-collapse:collapse; width:100%; background:var(--weiss); }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid rgba(10,10,10,.15); vertical-align:top; font-size:14px; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  td.zahl, th.zahl { text-align:right; white-space:nowrap; } .mono { font-family:var(--mono); }
  .etikett { display:inline-block; padding:2px 8px; border:2px solid var(--ink); border-radius:999px; font:600 12px/1.3 var(--sans); background:var(--weiss); white-space:nowrap; }
  .etikett.Verkauf { background:var(--pink); } .etikett.Lager { background:var(--gruen); } .etikett.Entsorgung { background:#e6e6e3; }
  .schritte { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .schritte span { padding:6px 14px; border:2px solid var(--ink); border-radius:24px; background:var(--weiss); font-weight:600; text-transform:uppercase; font-size:13px; }
  .schritte span.an { background:var(--pink); }
  /* Setup */
  .geb-zeile { display:grid; grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 80px auto; gap:8px; align-items:end; padding:10px 0; border-bottom:1px solid rgba(10,10,10,.15); }
  .geb-zeile label { margin:0 0 4px; font-size:12px; text-transform:uppercase; color:var(--muted); }
  .geb-zeile input, .geb-zeile select { width:100%; }
  .orte { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:6px; max-height:340px; overflow:auto; margin-top:8px; }
  .orte label { display:flex; gap:8px; align-items:center; margin:0; padding:6px 8px; border:1px solid rgba(10,10,10,.2); border-radius:4px; font-weight:400; }
  .orte label.an { background:var(--pink-hell); border-color:var(--ink); }
  /* Scan */
  .gebinde-wahl { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; margin-bottom:14px; }
  .gebinde-wahl button { text-align:left; border-radius:6px; padding:12px; text-transform:none; letter-spacing:0; line-height:1.3; }
  .gebinde-wahl button.an { background:var(--pink); border-width:4px; padding:10px; }
  .gebinde-wahl b { display:block; font-size:18px; } .gebinde-wahl small { display:block; color:var(--muted); font-weight:400; margin-top:4px; }
  #scan { height:64px; font-size:24px; font-family:var(--mono); }
  #rueck { min-height:60px; font-size:18px; }
  #rueck .gross { font-size:22px; font-weight:900; display:block; }
  .reiter { display:flex; gap:6px; margin:16px 0 8px; flex-wrap:wrap; }
  .reiter button.an { background:var(--ink); color:var(--weiss); }
  #lade { position:fixed; right:16px; bottom:16px; background:var(--ink); color:var(--weiss); padding:8px 14px; border-radius:24px; font-weight:600; font-size:13px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); max-width:640px; background:var(--ink); color:var(--weiss); padding:12px 18px; border-radius:6px; font-weight:600; z-index:9; }
  #toast.stop { background:#b00020; }
  /* Ungespeicherte Scans: bleibt sichtbar, bis sie gespeichert oder bewusst verworfen sind */
  #ungespeichert { background:#b00020; color:var(--weiss); padding:10px 24px; font-weight:600; border-bottom:2px solid var(--ink); position:sticky; top:0; z-index:6; }
  #ungespeichert p { margin:0 0 4px; } #ungespeichert button { background:var(--weiss); color:var(--ink); }
  .warn-text { color:#b00020; font-weight:600; font-size:13px; }
  /* Nicht gespeicherte Scans (Konflikte, Ablehnungen): bleibt stehen, bis erledigt (Prüfung 24.10.2026) */
  .karte.ng { background:var(--rot); border-color:#b00020; }
  .karte.ng h3 { color:#b00020; }
  td.gelb { background:var(--gelb); }
  /* Kamera-Scan (Handy): Leiste unten, bleibt beim Wechsel des Gebindes offen */
  .scan-reihe { display:flex; gap:8px; align-items:stretch; } .scan-reihe #scan { flex:1; min-width:0; }
  #kamera-knopf { white-space:nowrap; }
  #kamera { position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--ink); color:var(--weiss); padding:8px; border-top:2px solid var(--ink); }
  #kamera video { display:block; width:100%; height:34vh; object-fit:cover; border-radius:4px; background:#000; }
  #kamera .rahmen { position:absolute; left:12%; right:12%; top:calc(8px + 11vh); height:12vh; border:3px solid var(--pink); border-radius:6px; pointer-events:none; }
  #kamera .zeile { display:flex; gap:8px; align-items:center; margin-top:8px; }
  #kamera .zeile b { flex:1; font-size:15px; line-height:1.25; }
  #kamera .zeile button { background:var(--weiss); }
  #kamera .ok { color:#9ff0a8; } #kamera .warn { color:#ffe27a; } #kamera .stop { color:#ff9c9c; }
  body.kam main { padding-bottom:calc(34vh + 90px); }
  .karte { overflow-x:auto; }
  @media (max-width: 800px) {
    .geb-zeile { grid-template-columns:1fr 1fr; } main { padding:12px; }
    header { padding:10px 12px; gap:8px; } header .rechts { margin-left:0; width:100%; } header h1 { font-size:17px; }
    .gebinde-wahl { grid-template-columns:1fr 1fr; gap:8px; } .gebinde-wahl b { font-size:16px; }
    #scan { height:52px; font-size:20px; } .karte { padding:12px; } th, td { font-size:13px; padding:6px; }
    #rueck { font-size:16px; } #rueck .gross { font-size:18px; }
  }
</style>
</head>
<body>
<header>
  <h1>Umpack Tool</h1><span class="wo" id="wo"></span>
  <div class="rechts"><span class="still" id="version"></span><input type="text" id="kuerzel" placeholder="Kürzel" maxlength="4" style="width:90px;text-transform:uppercase"><button class="klein" data-a="zurStart">Durchgänge</button></div>
</header>
<div id="ungespeichert" hidden></div>
<main id="main"></main>
<div id="kamera" hidden></div>
<input type="file" id="foto-scan" accept="image/*" capture="environment" hidden>
<div id="lade" hidden>Speichert …</div>
<div id="toast" hidden></div>

<script>
(function () {
  'use strict';
  var V = { ansicht: 'start', start: null, D: null, setup: null, orte: null, aktiv: '', reiter: 'letzte', letzte: [], Q: [], qId: '', qLaeuft: false, haengt: null, rueck: null, offen: 0,
    qNr: 0, wTimer: null, waechter: 60000, ng: [], abfrageFehler: 0 };
  var NICHT_GEFUNDEN = 'Nicht gefunden – prüfen';
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function chf(n) { return 'CHF ' + (Math.round(Number(n || 0) * 100) / 100).toFixed(2); }
  function norm(s) { return String(s == null ? '' : s).trim().toUpperCase(); }
  /* Gleiche Regeln wie der Server (Vertrag V3): PG-ID «pg 0862» = «PG-862», Lagerort ohne Trennzeichen, Barcode ohne GS1-(01), Bindestriche, führende Nullen */
  function pgNorm(s) { var t = String(s == null ? '' : s).trim(), m = /^(PG|AN|RC|RT|ET)[\s'\-]?0*(\d+)$/i.exec(t); return m ? m[1].toUpperCase() + '-' + m[2] : t.toUpperCase(); }
  function ortKey(s) { return String(s == null ? '' : s).toUpperCase().replace(/[\s\-–—_.\/]+/g, ''); }
  function bcKey(s) {
    var b = String(s == null ? '' : s).replace(/['’\s\-]/g, '').replace(/^\(01\)(?=\d{14}$)/, '');
    if (/^01\d{14}$/.test(b)) b = b.slice(2);
    return /^\d+$/.test(b) ? b.replace(/^0+/, '') : b.toUpperCase();
  }
  function uhr() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function lies(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function merke(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ohne Speicher */ } }
  var toastZeit;
  function melde(t, stop) { var e = $('toast'); e.textContent = t; e.className = stop ? 'stop' : ''; e.hidden = false; clearTimeout(toastZeit); toastZeit = setTimeout(function () { e.hidden = true; }, stop ? 8000 : 3500); }
  function K() { return norm($('kuerzel').value).slice(0, 4); }

  /* Einziger Weg zum Server */
  function ruf(name, args, ok, fehler) {
    V.offen++; $('lade').hidden = false;
    var fertig = function () { V.offen--; $('lade').hidden = V.offen <= 0 && (!V.Q.length || !!V.haengt); };
    google.script.run.withSuccessHandler(function (x) { fertig(); if (ok) ok(x); })
      .withFailureHandler(function (e) { fertig(); var m = String((e && e.message) || e).replace(/^Error:\s*/, ''); if (fehler) fehler(m); else melde(m, true); }).api(name, args || []);
  }

  /* ---------- Start: alle Durchgänge ---------- */
  function zurStart() {
    if (V.Q.length && !V.haengt) { melde('Es wird noch gespeichert. Bitte einen Moment warten.', true); piep(false); return; }
    if (V.haengt) { V.Q = []; V.qId = ''; V.haengt = null; }      // bleibt im Speicher des Browsers und oben sichtbar
    V.ansicht = 'start'; V.D = null; history.replaceState && history.replaceState(null, '', '#');
    ruf('start', [], function (s) { V.start = s; $('version').textContent = 'Version ' + s.version; zeichne(); });
  }
  function startSeite() {
    var s = V.start, l = s ? s.durchgaenge : [];
    var offen = l.filter(function (d) { return d.status !== 'Abgeschlossen' && d.status !== 'Verworfen'; }), zu = l.filter(function (d) { return d.status === 'Abgeschlossen'; }), weg = l.filter(function (d) { return d.status === 'Verworfen'; });
    var tab = function (l) {
      return '<table><thead><tr><th>Durchgang</th><th>Name</th><th>Quelle</th><th>Status</th><th>Erstellt</th><th></th></tr></thead><tbody>' + l.map(function (d) {
        var weiter = d.status === 'Scan';
        return '<tr><td class="mono">' + esc(d.id) + '</td><td>' + esc(d.name) + '</td><td>' + esc(d.quelle) + (d.lagerorte ? ' · ' + esc(d.lagerorte) : '') + '</td><td>' + esc(d.status) + '</td><td>' + esc(d.erstellt) + '</td>'
          + '<td><button class="klein ' + (weiter ? 'pink' : '') + '" data-a="oeffne" data-v="' + esc(d.id) + '">' + (weiter ? 'Weiter' : 'Ansehen') + '</button></td></tr>';
      }).join('') + '</tbody></table>';
    };
    return '<div class="karte"><div class="reihe" style="justify-content:space-between"><h2 style="margin:0">Durchgänge</h2><button class="pink" data-a="neuerDurchgang">Neuer Durchgang</button></div>'
      + '</div>'
      + '<div class="karte"><h3>Offen</h3>' + (offen.length ? tab(offen) : '<p class="still">Keine.</p>') + '</div>'
      + (zu.length ? '<div class="karte"><h3>Abgeschlossen</h3>' + tab(zu) + '</div>' : '')
      + (weg.length ? '<div class="karte"><h3>Verworfen</h3>' + tab(weg) + '</div>' : '');
  }
  function oeffne(id) {
    /* Prüfung 24.10.2026: nicht während des Speicherns wechseln, sonst kürzt die Antwort die Schlange des anderen Durchgangs */
    if (V.qLaeuft || (V.Q.length && !V.haengt && V.qId && V.qId !== id)) { melde('Es wird noch gespeichert. Bitte einen Moment warten.', true); piep(false); return; }
    ruf('laden', [id], function (d) {
      if (V.qId && V.qId !== d.id) { if (V.qLaeuft) { melde('Es wird noch gespeichert. Bitte nochmals öffnen.', true); return; } V.Q = []; V.qId = ''; V.haengt = null; }     // Schlange eines anderen Durchgangs bleibt im Speicher (oben sichtbar)
      setzeD(d); ngLaden(d.id); V.ansicht = d.status === 'Scan' ? 'scan' : 'abschluss';
      /* Ungespeicherte Scans von vorher (Neuladen, Netz weg) nachsenden */
      var alt = []; try { alt = JSON.parse(lies('um-q-' + d.id) || '[]') || []; } catch (e) { alt = []; }
      if (alt.length && d.status === 'Scan') { V.Q = alt; V.qId = d.id; V.haengt = null; ueberlagere(d.zuordnung); melde(alt.length + ' Scans von vorher werden nachgespeichert.'); senden(); }
      zeichne();
    });
  }

  /* ---------- 1 · Setup ---------- */
  function hinw(d) { return d && d.hinweise && d.hinweise.length ? ' ' + d.hinweise.join(' ') : ''; }
  function neuerDurchgang() {
    var heute = new Date(), tag = ('0' + heute.getDate()).slice(-2) + '.' + ('0' + (heute.getMonth() + 1)).slice(-2) + '.' + heute.getFullYear();
    V.setup = { name: 'Umpacken ' + tag, quelle: 'rt', orte: {}, filter: '', liste: '', gebinde: [{ name: '', art: 'Verkauf', abnehmer: '', lagerort: '', preisregel: 'VP', prozent: '' }] };
    V.ansicht = 'setup'; zeichne();
    ladeOrte();      // immer frisch: belegte Lagerorte ändern sich
  }
  function ladeOrte() { ruf('lagerorte', [], function (o) { V.orte = o; if (V.ansicht === 'setup') zeichne(); }); }
  function setupSeite() {
    var s = V.setup, orte = V.orte;
    var fehlt = orte && orte.fehlend && orte.fehlend.length ? '<div class="meldung warn" style="margin-top:8px">Nicht gelesen (fehlt im Return Tool oder ohne Spalte ID, Bezeichnung, Lagerort): ' + esc(orte.fehlend.join(', ')) + '. Stücke dort fehlen in der Liste.</div>' : '';
    var ortListe = !orte ? '<p class="still">Lädt …</p>' : fehlt + '<div class="reihe" style="margin-top:8px"><input type="text" id="s-filter" placeholder="Filter, z.B. KID" value="' + esc(s.filter) + '" style="max-width:240px"><button class="klein" data-a="alleOrte">Alle</button><button class="klein" data-a="keineOrte">Keine</button><span class="still" id="s-zahl"></span></div><div class="orte" id="s-orte">' + ortHtml() + '</div>';
    var geb = s.gebinde.map(function (g, i) {
      return '<div class="geb-zeile" data-i="' + i + '">'
        + '<div><label>Name</label><input type="text" data-g="name" value="' + esc(g.name) + '" placeholder="z.B. Balu 1"></div>'
        + '<div><label>Art</label><select data-g="art">' + [['Verkauf', 'Verkauf an Abnehmer'], ['Lager', 'Neue Palette im Lager'], ['Entsorgung', 'Entsorgung']].map(function (a) { return '<option value="' + a[0] + '"' + (g.art === a[0] ? ' selected' : '') + '>' + a[1] + '</option>'; }).join('') + '</select></div>'
        + '<div><label>Abnehmer</label><input type="text" data-g="abnehmer" value="' + esc(g.abnehmer) + '" placeholder="' + (g.art === 'Verkauf' ? 'z.B. Balu' : '–') + '"' + (g.art === 'Verkauf' ? '' : ' disabled') + '></div>'
        + '<div><label>Neuer Lagerort</label><input type="text" data-g="lagerort" value="' + esc(g.lagerort) + '" placeholder="' + (g.art === 'Entsorgung' ? '–' : 'z.B. BALU-1') + '"' + (g.art === 'Entsorgung' ? ' disabled' : '') + ' style="text-transform:uppercase">'
        + (g.art !== 'Entsorgung' && belegtText(g.lagerort) ? '<div class="warn-text">' + esc(belegtText(g.lagerort)) + '</div>' : '')
        + (g.art === 'Lager' && orte ? vorschlagHtml(i) : '') + '</div>'
        + '<div><label>Preis</label><select data-g="preisregel"' + (g.art === 'Entsorgung' ? ' disabled' : '') + '>' + [['VP', 'VP'], ['Prozent', '% vom VP'], ['Null', '0 (gratis)']].map(function (a) { return '<option value="' + a[0] + '"' + ((g.art === 'Entsorgung' ? 'Null' : g.preisregel) === a[0] ? ' selected' : '') + '>' + a[1] + '</option>'; }).join('') + '</select></div>'
        + '<div><label>%</label><input type="number" min="0" max="100" data-g="prozent" value="' + esc(g.prozent) + '"' + (g.preisregel === 'Prozent' && g.art !== 'Entsorgung' ? '' : ' disabled') + '></div>'
        + '<div><button class="klein" data-a="gebWeg" data-v="' + i + '"' + (s.gebinde.length < 2 ? ' disabled' : '') + '>Entfernen</button></div></div>';
    }).join('');
    return '<div class="schritte"><span class="an">1 · Setup</span><span>2 · Scan</span><span>3 · Abschluss</span></div>'
      + '<div class="karte"><h2>Neuer Durchgang</h2><label for="s-name">Name</label><input type="text" id="s-name" value="' + esc(s.name) + '"></div>'
      + '<div class="karte"><h3>Quelle</h3><div class="reihe">'
      + '<label style="margin:0;display:flex;gap:6px;align-items:center"><input type="radio" name="quelle" value="rt"' + (s.quelle === 'rt' ? ' checked' : '') + '> Return Tool</label>'
      + '<label style="margin:0;display:flex;gap:6px;align-items:center"><input type="radio" name="quelle" value="manuell"' + (s.quelle === 'manuell' ? ' checked' : '') + '> Liste einfügen</label></div>'
      + (s.quelle === 'rt' ? ortListe : '<p class="still" style="margin-top:10px">Liste mit Kopfzeile einfügen. Pflicht: <b>ID</b>.</p><textarea id="s-liste" placeholder="ID&#9;Bezeichnung&#9;Barcode&#9;VP&#9;Lagerort">' + esc(s.liste) + '</textarea>')
      + '</div>'
      + '<div class="karte"><h3>Gebinde</h3>'
      + geb + '<div class="reihe" style="margin-top:12px"><button data-a="gebDazu">Gebinde hinzufügen</button></div></div>'
      + '<div class="karte"><div class="reihe"><button class="pink" data-a="anlegen">Speichern → Scan</button><button data-a="zurStart">Abbrechen</button></div></div>';
  }
  function ortHtml() {
    var s = V.setup, f = norm(s.filter);
    return V.orte.orte.filter(function (o) { return !f || norm(o.ort).indexOf(f) > -1; }).map(function (o) {
      var an = !!s.orte[o.ort];
      /* Zeilen ohne gültige ID fallen nicht still heraus: Anzahl pro Lagerort (Prüfung 24.10.2026) */
      return '<label class="' + (an ? 'an' : '') + '"><input type="checkbox" data-ort="' + esc(o.ort) + '"' + (an ? ' checked' : '') + '><span><b>' + esc(o.ort) + '</b> <span class="still">' + o.anzahl + '</span>'
        + (o.ohneId ? ' <span class="warn-text">' + o.ohneId + ' ohne ID</span>' : '') + '</span></label>';
    }).join('');
  }
  function ortZahl() {
    if (!$('s-zahl') || !V.orte) return;
    var n = 0, k = 0, x = 0;
    V.orte.orte.forEach(function (o) { if (V.setup.orte[o.ort]) { n += o.anzahl; k++; x += o.ohneId || 0; } });
    $('s-zahl').textContent = k ? k + ' Lagerorte, ' + n + ' Stücke gewählt' + (x ? ' · ' + x + ' Zeilen ohne ID kommen nicht mit' : '') : 'Noch nichts gewählt';
  }
  /* Neue Palette: nächste freie Nummer pro Kürzel (aus dem Return Tool und den Gebinden), z.B. KID → KID-13 */
  function vorschlagHtml(i) {

    if (!V.rueck || V.rueck.art !== 'ok') { KAM.letzteP = null; KAM.sperreBis = 0; }

  function kamText() {

          fertig(t);

  /* ---------- 3 · Abschluss ---------- */
  function abschlussSeite() {
    var d = V.D, fertig = d.status === 'Abgeschlossen', verworfen = d.status === 'Verworfen', z = d.zuordnung, tot = 0;

    var a = d.aenderungen, erl = a.filter(function (x) { return x.erledigt; }).length, abw = a.filter(function (x) { return /^ABWEICHUNG/.test(x.pruefung || ''); }).length;
    var akt = { 'Verkaufen': 'Lagerort auf das Gebinde setzen, dann im Return Tool «Lieferung erstellen» (setzt verkauft)', 'Lagerort ändern': 'Lagerort ändern', 'Entsorgen': 'Entsorgen' };
    akt[NICHT_GEFUNDEN] = 'Beim Umpacken nicht gefunden: am alten Lagerort suchen, sonst im Return Tool klären. Keine Änderung nötig.';
    h += (listen ? '<h3 style="margin-top:14px">Listen</h3><ul>' + listen + '</ul>' : '') + '</div>'
      + '<div class="karte"><div class="reihe" style="justify-content:space-between"><h2 style="margin:0">Return Tool</h2><span class="still">' + erl + ' von ' + a.length + ' erledigt</span></div>'
      + '<div class="reihe" style="margin:12px 0"><button data-a="kopieren">Liste kopieren</button><span class="still">Im Return Tool eintragen, dann abhaken. Verkauf: Lagerort setzen → «Lieferung erstellen».</span></div>'
      + (abw ? '<div class="meldung stop" style="margin-bottom:10px"><span class="gross">' + abw + ' Abweichungen zum Return Tool</span> Vor dem Eintragen prüfen (gelb). Suchen über die ID, die Zeile ist nur ein Hinweis.</div>' : '')
      + '<table><thead><tr><th><input type="checkbox" data-a="alleErledigt"></th><th>ID</th><th>Bezeichnung</th><th>Aktion</th><th>Tab · Zeile (Hinweis)</th><th>Lagerort alt → neu</th><th class="zahl">VP alt</th><th class="zahl">Preis</th><th>Prüfung</th></tr></thead><tbody>'
      + a.map(function (x) {
        var ng = x.aktion === NICHT_GEFUNDEN;
        return '<tr' + (x.erledigt ? ' style="opacity:.5"' : '') + '><td><input type="checkbox" data-erl="' + x.r + '"' + (x.erledigt ? ' checked' : '') + '></td><td class="mono">' + esc(x.id) + '</td><td>' + esc(x.name) + '</td><td title="' + esc(akt[x.aktion] || '') + '">' + (ng ? '<b>' + esc(x.aktion) + '</b>' : esc(x.aktion)) + (x.abnehmer ? ' · ' + esc(x.abnehmer) : '') + '</td><td>' + esc(x.tab) + ' · ' + esc(x.zeile) + '</td>'
          + '<td class="mono">' + esc(x.alt) + (ng ? '' : ' → <b>' + esc(x.neu || (x.aktion === 'Entsorgen' ? 'Entsorgen' : '')) + '</b>') + '</td><td class="zahl' + (!(x.vp > 0) ? ' gelb' : '') + '">' + chf(x.vp) + '</td>'

          + '<td' + (/^ABWEICHUNG/.test(x.pruefung || '') ? ' class="abw" style="background:var(--gelb)"' : '') + '>' + esc(x.pruefung || '') + '</td></tr>';
      }).join('')

  function abschliessen() {
    var d = V.D, offen = d.bestand.filter(function (p) { return !d.zuordnung[pgNorm(p.id)]; }).length;
    if (!confirm('Durchgang ' + d.id + ' abschliessen?' + (offen ? '\n\n' + offen + ' Stücke sind in keinem Gebinde: Sie bleiben, wo sie sind, und kommen als «' + NICHT_GEFUNDEN + '» in die Liste.' : '') + '\n\nDanach lässt sich nichts mehr scannen.')) return;

  function abschliessenSenden(bestaetigt) {
    var d = V.D;
    ruf('abschliessen', [d.id, K(), bestaetigt], function (x) {
      if (x && x.warnung) { if (confirm(x.warnung + '\n\nTrotzdem abschliessen?')) abschliessenSenden(true); return; }

  function zurueckScan() { V.ansicht = 'scan'; zeichne(); }
  function kopieren() {
    var a = V.D.aenderungen, t = ['ID\tBezeichnung\tAktion\tAbnehmer\tTab\tZeile (Hinweis)\tLagerort alt\tLagerort neu\tVP alt\tPreis\tPrüfung'].concat(a.map(function (x) { return [x.id, x.name, x.aktion, x.abnehmer, x.tab, x.zeile, x.alt, x.neu, x.vp.toFixed(2), x.aktion === NICHT_GEFUNDEN ? '' : x.preis.toFixed(2), x.pruefung || ''].join('\t'); })).join('\n');

  function erledigt(zeilen, wert) {

    ruf('erledigt', [V.D.id, l, wert], function (a) { V.D.aenderungen = a; zeichne(); }, function (m) { melde(m, true); piep(false); zeichne(); });

  /* ---------- Zeichnen und Ereignisse ---------- */
  function zeichne() {
    var m = $('main');

    else if (V.ansicht === 'setup') { $('wo').textContent = 'Neuer Durchgang'; m.innerHTML = setupSeite(); ortZahl(); }
    else if (V.ansicht === 'scan') { m.innerHTML = scanSeite(); if ($('scan') && !KAM.an && !istHandy()) $('scan').focus(); }
    else if (V.ansicht === 'abschluss') m.innerHTML = abschlussSeite();
  }
  var A = { zurStart: zurStart, oeffne: oeffne, neuerDurchgang: neuerDurchgang, gebDazu: gebDazu, gebWeg: gebWeg, vorschlag: vorschlag, alleOrte: alleOrte, keineOrte: keineOrte, anlegen: anlegen,
    aktiv: aktiv, reiter: reiter, scanne: scanne, verschieben: verschieben, entfernen: entfernen, zumAbschluss: zumAbschluss, abschliessen: abschliessen, zurueckScan: zurueckScan, kopieren: kopieren,
    bearbDazu: bearbDazu, bearbWeg: bearbWeg, bearbSpeichern: bearbSpeichern, kamera: kamera, qVerwerfen: qVerwerfen, verwerfen: verwerfen, ngWeg: ngWeg, ngAlle: ngAlle };
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]');
    if (b && A[b.getAttribute('data-a')] && b.tagName !== 'INPUT') {

      if (V.reiter !== 'bearbeiten') fokusScan();

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'foto-scan') { if (t.files && t.files[0]) fotoLesen(t.files[0]); else KAM.foto = false; return; }
    if (t.name === 'quelle') { setupLesen(); V.setup.quelle = t.value; zeichne(); return; }
    if (t.getAttribute('data-ort') !== null) { V.setup.orte[t.getAttribute('data-ort')] = t.checked; t.parentNode.className = t.checked ? 'an' : ''; ortZahl(); return; }
    if (t.getAttribute('data-g') && t.tagName === 'SELECT') { if (V.ansicht === 'setup') { setupLesen(); zeichne(); } else { bearbLesen(); $('reiter-inhalt').innerHTML = reiterHtml(); } return; }
    if (t.getAttribute('data-erl')) { erledigt([Number(t.getAttribute('data-erl'))], t.checked); return; }
    if (t.getAttribute('data-a') === 'alleErledigt') { erledigt(V.D.aenderungen.map(function (x) { return x.r; }), t.checked); return; }
    if (t.getAttribute('data-preis')) { preisSetzen(t.getAttribute('data-preis'), t.value); fokusScan(); }
  });
  document.addEventListener('input', function (ev) { if (ev.target.id === 's-filter') { V.setup.filter = ev.target.value; $('s-orte').innerHTML = ortHtml(); } });
  /* Hand-Scanner (Prüfung 24.10.2026): tippt sehr schnell (unter 50 ms pro Zeichen) und schliesst mit Enter. Landet das in der Scan-Ansicht ausserhalb
     des Scanfelds (Kürzel, Preisfeld, Knopf, nirgends), geht der Code ans Scanfeld und das andere Feld behält seinen alten Wert. */
  var TS = { buf: '', t: 0, el: null, alt: null };
  document.addEventListener('keydown', function (ev) {
    var t = ev.target, jetzt = Date.now();
    if (V.ansicht !== 'scan' || !$('scan') || (t && t.id === 'scan')) { TS.buf = ''; return; }
    if (ev.key && ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      if (!TS.buf || jetzt - TS.t > 50) { TS.buf = ''; TS.el = t; TS.alt = t && t.tagName === 'INPUT' ? t.value : null; }
      TS.buf += ev.key; TS.t = jetzt; return;
    }
    if (ev.key === 'Enter' && TS.buf.length >= 4 && jetzt - TS.t < 200) {
      ev.preventDefault(); ev.stopPropagation();
      var code = TS.buf; TS.buf = '';
      if (TS.el && TS.el.tagName === 'INPUT' && TS.alt !== null) { TS.el.value = TS.alt; if (TS.el.id === 'kuerzel') merke('um-kuerzel', K()); }
      $('scan').value = code; scanne(); fokusScan();
      return;
    }
    TS.buf = '';
  }, true);
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var a = ev.target.getAttribute('data-enter');
    if (a) { ev.preventDefault(); A[a](); return; }

  });
  $('kuerzel').value = lies('um-kuerzel') || '';
  $('kuerzel').addEventListener('input', function () { merke('um-kuerzel', K()); });
  window.addEventListener('beforeunload', function (e) { if (V.Q.length && !V.haengt) { e.preventDefault(); e.returnValue = ''; } });
  /* Nach einem Neuladen: ungespeicherte Scans aus dem Speicher nachsenden */
  zurStart();
  banner();
  window.UM = V;      // für Tests
  window.UMA = A;
  window.UMK = { KAM: KAM, treffer: treffer, fotoLesen: fotoLesen, kameraAus: kameraAus, kamBild: kamBild };
  window.UMF = { abfrage: abfrage, senden: senden, gebindeNeu: gebindeNeu };
})();
