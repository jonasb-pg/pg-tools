<!DOCTYPE html>
<html lang="de">
<head>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  /* Schrift des Cockpits (app.pretty-good.ch, CORS offen, geprüft am 14.10.2026). Fällt sie weg, greifen Outfit und DM Mono. */
  @font-face { font-family:sofiaPro; src:url(https://app.pretty-good.ch/_next/static/immutable/media/SofiaPro_SemiBold-s.p.33k5evrv8kzp6.woff2) format("woff2"); font-weight:400 600; font-display:swap; }
  @font-face { font-family:sofiaPro; src:url(https://app.pretty-good.ch/_next/static/immutable/media/SofiaPro_Black-s.p.05h8x691qwne-.woff2) format("woff2"); font-weight:700 900; font-display:swap; }
  @font-face { font-family:defaultSansMono; src:url(https://app.pretty-good.ch/_next/static/immutable/media/default_sans_book_mono_WEB-s.p.3obwk9h866pc7.woff2) format("woff2"); font-weight:400; font-display:swap; }
  /* Gestaltung nach dem Pretty Good Cockpit (Matchmaker), gleich wie im Ricardo Tool: schwarze 2px-Linien, graue Fläche, Pink als Akzent */
  :root { --ink:#0a0a0a; --muted:#696967; --grau:#d2d2ce; --weiss:#ffffff; --pink:#ffbaf5; --pink-hell:#fff5ff; --linie:rgba(10,10,10,.15);
    --gruen:#c9f2cf; --gelb:#fff1a8; --rot:#ffc9c4;
    --sans:sofiaPro, "Sofia Pro", Outfit, ui-sans-serif, system-ui, sans-serif; --mono:defaultSansMono, "DM Mono", ui-monospace, Menlo, monospace; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:400 16px/1.5 var(--sans); color:var(--ink); background:var(--weiss); }
  .app { display:flex; min-height:100%; }

  /* Seitenleiste */
  aside { flex:none; width:268px; background:var(--weiss); border-right:2px solid var(--ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .marke-kopf { padding:16px; border-bottom:2px solid var(--ink); }
  .marke-kopf img { display:block; height:32px; }
  .marke-kopf .wort { font-weight:900; font-size:13px; line-height:1; letter-spacing:.3px; }
  .gross { text-transform:uppercase; font-weight:600; letter-spacing:.8px; }
  .marke-kopf .gross { color:var(--muted); margin-top:6px; display:block; }
  .nav { padding:12px; flex:1; overflow:auto; }
  .nav .sektion { color:var(--muted); font-size:14px; letter-spacing:.7px; padding:8px 12px; }
  .nav button { display:flex; align-items:center; gap:12px; width:100%; height:44px; margin-bottom:6px; padding:10px 12px; text-align:left;
    background:transparent; border:2px solid transparent; border-radius:4px; font:600 16px/1 var(--sans); letter-spacing:.8px; text-transform:uppercase; color:var(--ink); cursor:pointer; }
  .nav button:hover { border-color:var(--ink); background:transparent; }
  .nav button.an { background:var(--pink); border-color:var(--ink); border-left-width:6px; }
  .nav button .zahl { margin-left:auto; }
  .zahl { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 5px; border:2px solid var(--ink); border-radius:999px; background:var(--pink); font:600 13px/1 var(--sans); }
  .fuss { padding:12px; border-top:2px solid var(--ink); }
  .fuss .info { font-size:14px; color:var(--muted); margin:0 0 10px; }
  .fuss .wer { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .fuss .wer b { font:900 18px/1 var(--sans); }
  .fuss .wer button { margin-left:auto; height:32px; padding:0 12px; font-size:12px; }
  .sprache { display:flex; border:2px solid var(--ink); border-radius:24px; overflow:hidden; }
  .sprache button { flex:1; height:36px; border:0; border-radius:0; background:var(--weiss); font:600 14px/1 var(--sans); letter-spacing:.7px; cursor:pointer; color:var(--ink); }
  .sprache button.an { background:var(--ink); color:var(--weiss); }

  /* Hauptbereich */
  .haupt { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--grau); }
  .top { background:var(--weiss); border-bottom:2px solid var(--ink); min-height:64px; padding:12px 32px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  .top h1 { margin:0; font:900 20px/1 var(--sans); text-transform:uppercase; }
  .top .sub { color:var(--muted); }
  /* PG-ID: die zentrale ID. Mono wie die Daten im Cockpit, umrandet, aber nie lauter als der Schritt, um den es gerade geht. */
  .pgid { display:inline-block; font:400 17px/1 var(--mono); padding:6px 8px; border:2px solid var(--ink); border-radius:4px; background:var(--weiss); color:var(--ink); white-space:nowrap; }
  .pgid.klein { font-size:15px; padding:0; border:0; }
  .uhr { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .uhr .zeit { font:400 22px/1 var(--mono); padding:8px 12px; border:2px solid var(--ink); border-radius:4px; background:var(--weiss); min-width:150px; text-align:center; }
  .uhr .zeit.ueber { background:var(--pink); }
  .uhr .zeit.pause { color:var(--muted); border-style:dashed; }
  main { padding:24px 32px 64px; max-width:1500px; width:100%; }
  h2 { margin:0 0 12px; font:900 18px/1.2 var(--sans); text-transform:uppercase; }
  h3 { margin:18px 0 8px; font:900 15px/1.2 var(--sans); text-transform:uppercase; letter-spacing:.3px; }
  h3:first-child { margin-top:0; }
  .karte { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:20px; margin-bottom:16px; }
  .karte.stop { border-width:4px; }
  p { margin:0 0 12px; }
  a { color:var(--ink); font-weight:600; text-underline-offset:3px; overflow-wrap:anywhere; }

  input[type=text], input[type=number], textarea, select { width:100%; font:600 16px/1.4 var(--sans); padding:8px 12px; border:2px solid var(--ink); border-radius:4px; background:var(--weiss); color:var(--ink); }
  input[type=text], input[type=number] { height:44px; }
  textarea { resize:vertical; font-weight:400; min-height:70px; }
  ::placeholder { color:#a3a3a0; font-weight:600; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, select:focus-visible, a:focus-visible { outline:3px solid var(--pink); outline-offset:2px; }
  #q { height:56px; font-size:20px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  label small { font-weight:400; font-size:14px; color:var(--muted); }

  button { font:600 14px/1 var(--sans); letter-spacing:.7px; text-transform:uppercase; cursor:pointer; height:40px; padding:0 18px; border:2px solid var(--ink); border-radius:24px; background:var(--weiss); color:var(--ink); }
  button:hover { background:var(--grau); }
  button.haupt-knopf { background:var(--pink); }
  button.haupt-knopf:hover { background:#f0a3e5; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.mini { height:30px; padding:0 10px; font-size:12px; border-radius:4px; }
  .wahl { display:flex; flex-wrap:wrap; gap:6px; }
  .wahl button { border-radius:4px; }
  .wahl button.an { background:var(--ink); color:var(--weiss); }

  .tabelle { border:2px solid var(--ink); border-radius:4px; overflow:auto; background:var(--weiss); margin-top:12px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--grau); color:var(--muted); font:600 14px/1.2 var(--sans); letter-spacing:.7px; text-transform:uppercase; text-align:left; padding:10px 14px; border-bottom:2px solid var(--ink); white-space:nowrap; }
  td { padding:10px 14px; border-bottom:1px solid var(--linie); vertical-align:middle; font-weight:600; }
  tr:last-child td { border-bottom:0; }
  .mono { font:400 14px/1.4 var(--mono); color:var(--muted); }

  .meldung { padding:12px 16px; border:2px solid var(--ink); border-radius:4px; margin:12px 0; background:var(--weiss); }
  .meldung.warn { background:var(--pink-hell); }
  .meldung.ok { background:var(--pink); }
  /* Kennzahlen: Kacheln mit einer grossen Zahl */
  .kacheln { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin:0 0 16px; }
  .kachel { background:var(--weiss); border:2px solid var(--ink); border-radius:4px; padding:14px 16px; }
  .kachel .z { font:900 30px/1.1 var(--sans); margin:4px 0; }
  .kachel .n { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.6px; font-weight:600; }
  .kachel .u { color:var(--muted); font-size:14px; }
  .balken { height:10px; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:var(--weiss); margin:6px 0 2px; }
  .balken i { display:block; height:100%; background:var(--pink); }
  .adm-reiter { margin:0 0 16px; }
  td.zahl-r, th.zahl-r { text-align:right; white-space:nowrap; }
  .meldung.stop { background:var(--ink); color:var(--weiss); }
  .meldung ul { margin:6px 0 0; padding-left:20px; }
  .etikett { display:inline-block; padding:6px 8px; border-radius:4px; background:var(--grau); font:600 13px/1 var(--sans); letter-spacing:.7px; text-transform:uppercase; white-space:nowrap; }
  .etikett.hell { background:var(--pink); }
  .score { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; border:2px solid var(--ink); border-radius:4px; font:600 13px/1 var(--sans); letter-spacing:.5px; text-transform:uppercase; white-space:nowrap; }
  .score b { font:400 14px/1 var(--mono); }
  .score.Gruen { background:var(--gruen); } .score.Gelb { background:var(--gelb); } .score.Rot { background:var(--rot); }

  .feld { display:grid; grid-template-columns:170px 1fr auto; gap:14px; align-items:start; padding:12px 0; border-bottom:1px solid var(--linie); }
  .feld:last-child { border-bottom:0; }
  .feld .name { color:var(--muted); font-size:14px; letter-spacing:.7px; text-transform:uppercase; font-weight:600; padding-top:2px; }
  .feld .wert { white-space:pre-wrap; word-break:break-word; font-weight:600; }
  .feld .wert small { display:block; white-space:normal; font-weight:400; font-size:14px; color:var(--muted); margin-top:4px; }
  .feld .seite { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .reihe { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .reihe > .breit { flex:1; min-width:200px; }
  .raster { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:0 20px; }
  .still { color:var(--muted); font-size:14px; }
  [hidden] { display:none !important; }

  /* Analyse: ein Schritt pro Bildschirm */
  #arbeit { max-width:900px; }
  .schiene { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; padding:0; list-style:none; }
  .schiene li { display:flex; align-items:center; gap:8px; padding:6px 10px 6px 6px; border:2px solid var(--ink); border-radius:999px; background:var(--weiss); font:600 13px/1 var(--sans); letter-spacing:.5px; text-transform:uppercase; }
  .schiene .nr { width:22px; height:22px; border-radius:50%; background:var(--grau); display:flex; align-items:center; justify-content:center; font:600 12px/1 var(--sans); }
  .schiene li[data-a] { cursor:pointer; }
  .schiene li[data-a]:hover { background:var(--pink-hell); color:var(--ink); }
  .schiene li.fertig { background:var(--grau); color:var(--muted); }
  .schiene li.fertig .nr, .schiene li.aktiv .nr { background:var(--ink); color:var(--weiss); }
  .schiene li.aktiv { background:var(--pink); }
  .schiene li.aus { border-style:dashed; color:var(--muted); background:transparent; text-decoration:line-through; }
  .kopf { display:flex; gap:12px; align-items:center; margin-bottom:6px; }
  .kopf .nr { flex:none; width:38px; height:38px; border-radius:50%; background:var(--pink); border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-weight:900; }
  .kopf h2 { margin:0; font-size:24px; }
  .frage { font:600 20px/1.3 var(--sans); margin:14px 0 16px; }
  .abstand { margin:10px 0 0; }
  .knoepfe { display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .knopf { min-height:56px; height:auto; padding:0 24px; border-radius:28px; font-size:16px; flex:1 1 220px; }
  .knopf.pink { background:var(--pink); }
  .knopf.pink:hover { background:#f0a3e5; }
  .knopf.schwarz { background:var(--ink); color:var(--weiss); }
  .knopf.schwarz:hover { background:#333; }
  .leiste { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-top:22px; padding-top:14px; border-top:1px solid var(--linie); }
  /* Handbuch: Chip neben der Uhr, Schritt «Handbuch», Auszug in den Schritten */
  .hb-chip { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border:2px solid var(--ink); border-radius:999px; background:var(--weiss); font:600 13px/1 var(--sans); letter-spacing:.6px; text-transform:uppercase; white-space:nowrap; }
  .hb-chip.ok { background:var(--pink); }
  .hb-chip.rot { background:var(--ink); color:var(--weiss); cursor:pointer; }
  .dreh { width:12px; height:12px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:dreh 1s linear infinite; flex:none; }
  @keyframes dreh { to { transform:rotate(360deg); } }
  .hb-wege { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:760px) { .hb-wege { grid-template-columns:1fr; } }
  .hb-box { border:2px solid var(--ink); border-radius:4px; padding:16px; }
  .hb-box .n { font:900 13px/1 var(--sans); letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .hb-box .still { margin:10px 0 0; }
  a.knopf { display:flex; align-items:center; justify-content:center; border:2px solid var(--ink); background:var(--weiss); text-decoration:none; font-weight:600; letter-spacing:.7px; text-transform:uppercase; }
  a.knopf:hover { background:var(--grau); }
  .ablage { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:96px; border:2px dashed var(--ink); border-radius:4px; padding:8px; text-align:center; font:600 15px/1.4 var(--sans); color:var(--muted); cursor:pointer; }
  .ablage:hover, .ablage.drueber { background:var(--pink-hell); color:var(--ink); }
  .hb-warte { display:flex; align-items:center; gap:10px; margin:6px 0 0; }
  .hb-chip.ok { cursor:pointer; }
  .teil-q { margin:12px 0 8px; }
  .ric { border-top:2px solid var(--ink); margin-top:18px; padding-top:6px; }
  .ric-box { border:2px solid var(--ink); border-radius:4px; padding:16px; margin:12px 0; }
  .ric-box > .n { font:900 13px/1 var(--sans); letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .ric-fotos { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .ric-qr { width:150px; flex:none; display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .ric-qr svg, .ric-qr img { width:150px; height:150px; border:2px solid var(--ink); border-radius:4px; }
  .ric-slots { flex:1 1 420px; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; min-width:0; }
  @media (max-width:760px) { .ric-slots { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .ric-slot { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .ric-slot strong { font-size:14px; }
  .ric-bilder { display:flex; flex-wrap:wrap; gap:4px; min-height:64px; }
  .ric-bild { position:relative; width:64px; height:64px; border:2px solid var(--ink); border-radius:4px; overflow:hidden; background:var(--grau); }
  .ric-bild img { width:100%; height:100%; object-fit:cover; display:block; }
  .ric-bild button { position:absolute; top:2px; right:2px; height:22px; width:22px; padding:0; border-radius:50%; font-size:12px; line-height:1; }
  .ric-leer { width:64px; height:64px; border:2px dashed var(--muted); border-radius:4px; }
  .ric-check { display:flex; gap:8px; align-items:center; font-size:14px; }
  .ric-versand { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
  .ric-versand button { height:auto; min-height:48px; text-transform:none; letter-spacing:0; }
  .ric-versand button.an { background:var(--pink); }
  .ric-zahl { color:var(--muted); font-weight:400; }
  #r-beschrieb { min-height:260px; }
  .vorschlag { display:inline-block; align-self:center; padding:4px 8px; border-radius:4px; background:var(--ink); color:var(--weiss); font:600 12px/1 var(--sans); letter-spacing:.6px; text-transform:uppercase; }
  .kanal { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin-top:16px; }
  .kanal > div { display:flex; flex-direction:column; gap:6px; }
  .kanal .knopf, .fs-zeile .knopf { width:100%; flex:none; }
  #foto-seite { max-width:520px; margin:0 auto; padding:20px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  #foto-seite[hidden] { display:none; }
  .app[hidden] { display:none; }
  .fs-kopf { display:flex; flex-direction:column; gap:4px; border-bottom:2px solid var(--ink); padding-bottom:12px; }
  .fs-zeile { display:flex; flex-direction:column; gap:10px; border:2px solid var(--ink); border-radius:4px; padding:12px; }
  .fs-zeile.offen { background:var(--pink-hell); }
  .fs-titel { display:flex; align-items:center; gap:10px; }
  .fs-titel div { flex:1; display:flex; flex-direction:column; }
  .fs-titel span.still { font-size:14px; }
  .fb-auf { width:100%; margin-bottom:12px; background:var(--pink); }
  #fb { position:fixed; inset:0; z-index:45; background:rgba(10,10,10,.45); display:flex; align-items:center; justify-content:center; padding:16px; }
  #fb[hidden] { display:none; }
  .fb-karte { width:min(520px, 100%); margin:0; }
  .fb-karte h2 { margin:0 0 12px; }
  .fb-karte textarea { resize:vertical; }
  .fb-karte #fb-wo { margin:8px 0 0; }
  .shops { display:flex; flex-wrap:wrap; gap:10px; }
  .shop { display:inline-flex; align-items:center; gap:8px; }
  .shop .knopf { flex:none; min-height:44px; }
  .infoknopf { position:relative; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border:2px solid var(--ink); border-radius:50%; font:900 13px/1 var(--sans); cursor:help; background:var(--weiss); }
  .infoknopf .tipp { display:none; position:absolute; left:50%; bottom:calc(100% + 8px); transform:translateX(-50%); width:max-content; max-width:260px; padding:8px 10px; border:2px solid var(--ink); border-radius:4px; background:var(--weiss); font:400 13px/1.4 var(--sans); z-index:30; text-align:left; }
  .infoknopf:hover .tipp, .infoknopf:focus .tipp { display:block; }
  button.seite-link { border:0; border-radius:0; background:none; padding:0; height:auto; font:inherit; letter-spacing:0; text-transform:none; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; color:var(--ink); }
  .sicher-eigen { display:inline-block; margin-left:8px; padding:3px 6px; border-radius:4px; background:var(--pink); font:600 11px/1 var(--sans); letter-spacing:.5px; text-transform:uppercase; vertical-align:middle; }
  #hb-ansicht { position:fixed; inset:0; z-index:50; background:rgba(10,10,10,.55); display:flex; padding:16px; }
  #hb-ansicht[hidden] { display:none; }
  .hv { flex:1; display:flex; flex-direction:column; background:var(--weiss); border:2px solid var(--ink); border-radius:4px; min-width:0; }
  .hv-kopf { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 16px; border-bottom:2px solid var(--ink); }
  .hv-kopf h2 { margin:0; font:900 16px/1.2 var(--sans); text-transform:uppercase; flex:1 1 200px; overflow-wrap:anywhere; }
  .hv-kopf input { flex:1 1 220px; width:auto; margin:0; }
  .hv-kopf .knopf { flex:none; min-height:44px; }
  .hv-fuss .knopf { flex:none; min-width:72px; min-height:44px; }
  .hv-rumpf { flex:1; display:flex; min-height:0; }
  .hv-treffer { width:300px; flex:none; overflow:auto; border-right:2px solid var(--ink); padding:8px; }
  .hv-treffer button { display:block; width:100%; height:auto; border-radius:0; text-align:left; text-transform:none; letter-spacing:0; min-height:0; border:0; border-bottom:1px solid var(--linie); background:none; padding:8px; font:400 14px/1.4 var(--sans); cursor:pointer; }
  .hv-treffer button:hover, .hv-treffer button.an { background:var(--pink-hell); }
  .hv-treffer mark { background:var(--pink); }
  .hv-seite { flex:1; overflow:auto; padding:12px; background:var(--grau); text-align:center; }
  .hv-seite canvas { background:#fff; box-shadow:0 0 0 2px var(--ink); max-width:100%; }
  .hv-fuss { display:flex; gap:10px; align-items:center; justify-content:center; padding:10px; border-top:2px solid var(--ink); }
  @media (max-width:760px) { .hv-rumpf { flex-direction:column; } .hv-treffer { width:auto; max-height:30vh; border-right:0; border-bottom:2px solid var(--ink); } #hb-ansicht { padding:0; } }
  .link { height:auto; background:none; border:0; border-radius:0; padding:6px 0; text-decoration:underline; text-underline-offset:3px; }
  .link:hover { background:none; }
  .link.rechts { margin-left:auto; color:var(--muted); }
  .liste { margin:0; padding:0; list-style:none; border:2px solid var(--ink); border-radius:4px; overflow:hidden; }
  .liste li { display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--linie); font-weight:600; min-width:0; }
  .liste li:last-child { border-bottom:0; }
  .liste .txt { flex:1; min-width:0; overflow-wrap:anywhere; }
  .liste .punkt { flex:none; width:10px; height:10px; border-radius:50%; background:var(--ink); }
  .liste li.wahlzeile { padding:0; }
  .liste button.zeile { display:flex; gap:12px; align-items:center; width:100%; height:auto; min-height:52px; padding:10px 14px; border:0; border-radius:0; background:none; text-align:left; text-transform:none; letter-spacing:0; font:600 16px/1.4 var(--sans); }
  .liste button.zeile:hover { background:var(--pink-hell); }
  .liste li.rot { background:var(--rot); }
  .liste li.gesperrt { opacity:.45; }
  .zeilen-hinweis { display:block; font-weight:400; font-size:14px; color:var(--muted); margin-top:2px; white-space:pre-wrap; }
  .jn { display:flex; gap:6px; flex:none; }
  .jn button { border-radius:4px; padding:0 14px; font-size:13px; }
  .jn button.ok.an { background:var(--gruen); } .jn button.nok.an { background:var(--rot); } .jn button.np.an { background:var(--gelb); }
  .chip { height:32px; padding:0 10px; border:2px solid var(--ink); border-radius:4px; background:var(--grau); font-size:13px; }
  .chip.rot { background:var(--rot); }
  .gruppe { margin:18px 0 8px; }
  .wlan { display:inline-block; margin:0 0 12px; padding:6px 10px; border-radius:4px; background:var(--grau); font:400 15px/1.3 var(--mono); overflow-wrap:anywhere; }   /* ohne Grossschreibung: das Passwort steht da, wie es ist */
  .etikett.gruen { background:var(--gruen); } .etikett.gelb { background:var(--gelb); }
  .meldung h3 { margin:0 0 6px; font-size:14px; }
  .meldung.gelb { background:var(--gelb); }
  #a-unter { gap:8px 10px; }
  #maengel { min-height:110px; font-weight:600; }
  .grade { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; }
  .grade button { height:auto; text-align:left; padding:14px; border-radius:4px; text-transform:none; letter-spacing:0; min-width:0; }
  .grade button b { display:block; font:900 34px/1 var(--sans); margin-bottom:8px; }
  .grade button strong { display:block; font:600 15px/1.2 var(--sans); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .grade button span { font:400 14px/1.4 var(--sans); color:var(--muted); }
  .grade button.an { background:var(--pink); }
  .urteil { font:900 30px/1.05 var(--sans); text-transform:uppercase; padding:18px; border:2px solid var(--ink); border-radius:4px; margin:14px 0; }
  .urteil.ja { background:var(--gruen); } .urteil.nein { background:var(--ink); color:var(--weiss); }
  .urteil small { display:block; font:600 15px/1.3 var(--sans); text-transform:none; margin-top:8px; }
  .werte { display:grid; grid-template-columns:140px minmax(0, 1fr); gap:6px 14px; margin:14px 0; }
  .werte dt { color:var(--muted); font:600 13px/1.6 var(--sans); letter-spacing:.7px; text-transform:uppercase; }
  .werte dd { margin:0; font-weight:600; overflow-wrap:anywhere; }
  #start { position:fixed; inset:0; background:var(--grau); z-index:20; display:flex; align-items:center; justify-content:center; padding:20px; }
  #start .karte { width:100%; max-width:440px; margin:0; }
  #start input { height:64px; font:900 32px/1 var(--sans); text-align:center; text-transform:uppercase; letter-spacing:4px; }
  #lade { position:fixed; right:20px; bottom:20px; background:var(--ink); color:var(--weiss); padding:10px 16px; border-radius:24px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; font-size:13px; z-index:30; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); max-width:min(640px, 90vw); padding:12px 18px; border:2px solid var(--ink); border-radius:4px; background:var(--pink); font-weight:600; z-index:40; }
  #toast.stop { background:var(--ink); color:var(--weiss); }

  @media (max-width: 860px) {
    .app { display:block; }
    aside { width:auto; height:auto; position:static; border-right:0; border-bottom:2px solid var(--ink); }
    .nav { display:flex; flex-wrap:wrap; gap:6px; }
    .nav .sektion { display:none; }
    .nav button { width:auto; margin:0; }
    main, .top { padding-left:16px; padding-right:16px; }
    .feld { grid-template-columns:1fr; gap:4px; }
    .feld .seite { flex-direction:row; flex-wrap:wrap; align-items:center; }
    .raster { grid-template-columns:1fr; }
    .schiene li:not(.aktiv) .name { display:none; }
    .schiene li:not(.aktiv) { padding:6px; }
    .grade { grid-template-columns:1fr; }
    .liste li.fn { flex-wrap:wrap; }
    .liste li.fn .txt { flex:1 1 100%; }
    .liste li.fn .jn { width:100%; }
    .liste li.fn .jn button { flex:1; }
    .werte { grid-template-columns:1fr; gap:0; }
    .werte dd { margin-bottom:8px; }
  }
</style>
</head>
<body>

<!-- ===================== SESSION ===================== -->
<div id="start" hidden>
  <div class="karte">
    <h2 data-t="start.titel"></h2>
    <input type="text" id="kuerzel" maxlength="4" autocomplete="off" data-tp="start.platz" data-enter="sessionStart">
    <div id="start-meldung"></div>
    <p style="margin:16px 0 0"><button class="haupt-knopf" data-a="sessionStart" data-t="start.knopf"></button></p>
  </div>
</div>

<div class="app">
  <aside>
    <div class="marke-kopf">
      <img id="logo" src="https://app.pretty-good.ch/logo/logo-pretty-good.svg" alt="Pretty Good">
      <div class="wort" id="wort" hidden>PRETTY<br>GOOD</div>
      <span class="gross">Analyse</span>
    </div>
    <div class="nav">
      <div class="sektion gross" data-t="nav.sektion"></div>
      <button id="nav-scan" class="an" data-a="zeige" data-v="scan"><span data-t="nav.scan"></span></button>
      <button id="nav-teile" data-a="zeige" data-v="teile"><span data-t="nav.teile"></span></button>
      <button id="nav-werkstatt" data-a="zeige" data-v="werkstatt"><span data-t="nav.werkstatt"></span></button>
      <div class="sektion gross" id="nav-sektion2" data-t="nav.sektion2" hidden></div>
      <button id="nav-admin" data-a="zeige" data-v="admin" hidden><span data-t="nav.admin"></span></button>
    </div>
    <div class="fuss">
      <button class="fb-auf" data-a="fbAuf" data-t="fb.knopf"></button>
      <div class="wer"><span class="still" data-t="fuss.kuerzel"></span> <b id="wer"></b><button data-a="sessionEnde" data-t="fuss.ende"></button></div>
      <div class="sprache" role="group" aria-label="Sprache / Language">
        <button id="l-de" data-a="sprache" data-v="de">DE</button>
        <button id="l-en" data-a="sprache" data-v="en">EN</button>
      </div>
      <p class="info" id="version" style="margin:10px 0 0"></p>
    </div>
  </aside>

  <div class="haupt">
    <header class="top">
      <h1>Analyse</h1><span class="gross sub" id="top-sub"></span>
      <div class="uhr" id="uhr" hidden>
        <span class="hb-chip" id="hb-chip" hidden></span>
        <span class="zeit" id="uhr-zeit">00:00</span>
        <button data-a="pause" id="uhr-knopf"></button>
        <button data-a="abbruch" id="a-abbruch"></button>
      </div>
    </header>
    <main>

      <!-- ===================== SCAN ===================== -->
      <section id="s-scan">
        <div id="scan-suche">
          <div class="karte">
            <input type="text" id="q" data-tp="such.platz" data-enter="suchen" autocomplete="off">
            <div id="such-meldung"></div>
            <div id="treffer"></div>
            <p style="margin:14px 0 0"><a href="#" target="_self" data-a="ohneZeigen" data-t="ohne.link"></a></p>
            <p class="still" id="schlange-info" style="margin:8px 0 0"></p>
          </div>
          <div class="karte" id="ohne" hidden>
            <h2 data-t="ohne.titel"></h2>
            <label for="o-name" data-t="ohne.name"></label><input type="text" id="o-name" data-tp="ohne.name.platz" autocomplete="off">
            <label for="o-link" data-t="ohne.link2"></label><input type="text" id="o-link" placeholder="https://www.galaxus.ch/..." autocomplete="off">
            <div class="reihe">
              <div class="breit"><label for="o-vp" data-t="ohne.vp"></label><input type="number" id="o-vp" min="0" step="1"></div>
              <div class="breit"><label for="o-ovp"><span data-t="ohne.ovp"></span> <small data-t="frei"></small></label><input type="number" id="o-ovp" min="0" step="any"></div>
              <div class="breit"><label data-t="ohne.kat"></label><div class="wahl" id="o-kat"></div></div>
            </div>
            <div id="ohne-meldung"></div>
            <p style="margin:16px 0 0"><button class="haupt-knopf" id="o-knopf" data-a="ohneAnlegen" data-t="ohne.knopf"></button></p>
          </div>
          <div id="fertig"></div>
          <div id="rep-liste"></div>
        </div>

        <div id="arbeit" hidden>
          <div class="karte">
            <div class="reihe" style="align-items:flex-start">
              <div class="breit">
                <h2 id="a-titel" style="margin-bottom:6px"></h2>
                <div class="reihe" id="a-unter"></div>
              </div>
              <button class="mini" data-a="zeige" data-v="teile" data-t="a.teil"></button>
            </div>
          </div>
          <ol class="schiene" id="schiene"></ol>
          <div id="schritt"></div>

          <div class="karte" id="infos" hidden>
            <h2 data-t="ub.titel"></h2>
            <div id="ub-infos"></div>
          </div>
        </div>
      </section>

      <!-- ===================== ERSATZTEILE ===================== -->
      <section id="s-teile" hidden>
        <div class="karte">
          <h2 data-t="teil.titel"></h2>
          <div class="raster">
            <div><label for="t-name" data-t="teil.produkt"></label><input type="text" id="t-name" data-tp="ohne.name.platz" data-enter="teilSuchen" autocomplete="off"></div>
            <div><label for="t-teil" data-t="teil.welches"></label><input type="text" id="t-teil" data-tp="teil.platz" data-enter="teilSuchen" autocomplete="off"></div>
          </div>
          <div id="t-meldung"></div>
          <p style="margin:16px 0 0"><button class="haupt-knopf" id="t-knopf" data-a="teilSuchen" data-t="teil.knopf"></button></p>
        </div>
        <div class="karte" id="teile-karte" hidden>
          <h2 data-t="teil.liste"></h2>
          <div id="teile"></div>
        </div>
        <div class="karte">
          <h2 data-t="bs.titel"></h2>
          <p class="still" data-t="bs.text"></p>
          <div id="bestell"></div>
        </div>
      </section>

      <!-- ===================== WERKSTATT (Testkonten, Testmittel) ===================== -->
      <section id="s-werkstatt" hidden>
        <div class="karte"><h2 data-t="ws.konten"></h2><div id="ws-konten"></div></div>
        <div class="karte"><h2 data-t="ws.mittel"></h2><div id="ws-mittel"></div></div>
      </section>

      <!-- ===================== ADMIN: Betrieb, Kennzahlen, Feedback ===================== -->
      <section id="s-admin" hidden>
        <div class="wahl adm-reiter" id="adm-reiter"></div>
        <div id="adm-betrieb">
          <div class="karte">
            <div class="reihe">
              <div class="breit"><h2 style="margin:0" data-t="adm.zustand"></h2></div>
              <button id="adm-knopf" data-a="test" data-t="adm.test"></button>
              <a id="adm-sheet" href="#" data-t="adm.sheet"></a>
            </div>
            <div id="adm-status"></div>
            <div id="adm-test"></div>
          </div>
          <div class="karte">
            <div class="reihe">
              <div class="breit"><h2 style="margin:0" data-t="liste.titel"></h2><span class="still" id="liste-zahlen"></span></div>
              <button data-a="aktualisieren" data-t="liste.neu"></button>
              <button data-a="aktualisieren" data-v="1" id="liste-fehler" hidden data-t="liste.fehler"></button>
            </div>
            <div id="liste-meldung"></div>
            <div id="liste"></div>
          </div>
          <div class="karte"><h2 data-t="adm.batches"></h2><div id="adm-batches"></div></div>
        </div>
        <div id="adm-kennzahlen" hidden></div>
        <div id="adm-feedback" hidden><div class="karte"><h2 data-t="af.titel"></h2><div id="af-liste"></div></div></div>
      </section>

    </main>
  </div>
</div>

<div id="foto-seite" hidden>
  <div class="fs-kopf"><span class="gross" data-t="fs.titel"></span><span class="mono" id="fs-id" style="font-size:22px"></span><strong id="fs-name"></strong></div>
  <div id="fs-liste"></div>
  <input type="file" id="fs-datei" accept="image/*" capture="environment" hidden>
  <p class="still" data-t="fs.hinweis"></p>
</div>
<div id="lade" hidden></div>
<div id="toast" hidden></div>

<div id="fb" hidden><div class="fb-karte karte" role="dialog" aria-modal="true" aria-labelledby="fb-titel">

  /* ---------- Matchmaker ---------- */
  /* Läuft einmal pro Analyse im Hintergrund, nach der bestätigten Identität (oder beim Entscheid, falls noch nicht). aus = Aufträge, die beim Wiedereinstieg nicht mehr zählen. */
  function mmStart() {
    if (!AN || (AN.mm && !AN.mm.fehler)) return;
    var id = AN.d.produkt.id, i = AN.d.ident || {}, neu = function () { return AN && AN.d.produkt.id === id && schritt() === 'entscheid'; };
    var lauf = Date.now(), meins = function () { return AN && AN.d.produkt.id === id && AN.mmLauf === lauf; };          // ein älterer Abgleich (z.B. vor «Modell neu») zählt nicht
    AN.mm = { laeuft: true }; AN.mmLauf = lauf; sichern();
    google.script.run.withSuccessHandler(function (r) { if (!meins()) return; AN.mm = r; sichern(); if (neu()) zeichneSchritt(); })
      .withFailureHandler(function (e) { if (!meins()) return; AN.mm = { fehler: String((e && e.message) || e).replace(/^Error:\s*/, '') }; sichern(); if (neu()) zeichneSchritt(); })
      .api(L, 'matchmaker', [id, { marke: i.marke || '', modell: i.modell || '', nr: i.herstellernr || '' }, AN.mmAus || []]);
  }
  function mmNochmal() { AN.mm = null; mmStart(); zeichneSchritt(); }

    var x = AN.mm, auftrag = function (a) { return '<p><strong>' + tx('mm.gesucht', a.gesucht) + '</strong>' + (a.mehr ? ' · ' + esc(a.mehr) : '') + (a.limit ? ' · ' + tx('mm.limit', a.limit) : '') + (a.hinweis ? '<br><span class="still">' + esc(a.hinweis) + '</span>' : '') + '</p>'; };
    if (!x) { mmStart(); x = AN.mm; }
    if (x.laeuft) return { sperrt: true, html: '<p class="hb-warte"><span class="dreh"></span>' + tx('mm.prueft') + '</p>' };
    if (x.fehler) return { sperrt: false, html: '<div class="meldung warn">' + tx('mm.fehler', x.fehler) + '<div class="knoepfe">' + taste('mmNochmal', 'mm.nochmal') + '</div></div>' };

    return { sperrt: false, html: x.aehnlich && x.aehnlich.length ? '<div class="meldung"><h3>' + tx('mm.aehnlich') + '</h3>' + x.aehnlich.map(auftrag).join('') + '</div>' : '' };
  }
  /* Wiedereinstieg aus dem Regal «Matchmaker»: Stand der Analyse zurück, direkt zum Entscheid. Der alte Auftrag zählt nicht mehr, die anderen werden neu geprüft. */

  /* ---------- Reparaturfrage und Kernfunktion ohne Prüfung ---------- */

  /* ---------- Was im Ablauf geklickt wird ---------- */
  function stand() { if (LAUF.urteilFehler) LAUF.urteilBild = ''; sichern(); zeichneSchritt(); }      // nach einem Fehler holt der nächste Klick das Urteil noch einmal
  function weiter() { if (schritt() === 'ident') mmStart(); AN.i++; LAUF.raus = false; stand(); }       // nach der bestätigten Identität: Matchmaker im Hintergrund
  /* Ohne weitere Prüfung nicht reusable: Der Ablauf springt zum Entscheid, die Schritte dazwischen entfallen. */
  function ko(art, text, mehr) {
    var k = { schritt: schritt() || '', art: art, text: text || '' };
    Object.keys(mehr || {}).forEach(function (x) { k[x] = mehr[x]; });
    AN.s.ko = k; AN.s.ab = AN.i; AN.gate = null; LAUF.raus = false;
    if (AN.d.ablauf.length) AN.i = AN.d.ablauf.length - 1;
    stand();
  }
  function koFest(art) { ko(art); }
  /* Schritt direkt wählen. Wer nach einem K.-o. einen früheren Schritt wählt, nimmt das K.-o. zurück wie mit «Zurück». Abschliessen geht erst, wenn der Server nichts Offenes mehr meldet. */
  function springe(v) {
    var s = AN.s, n = Number(v);
    if (AN.nachMm) return;                                                       // Wiedereinstieg aus dem Matchmaker: nur der Ausgang ist neu
    if (isNaN(n) || n < 0 || n >= AN.d.ablauf.length) return;
    LAUF.raus = false; AN.gate = null;
    if ((s.ko || s.versiegelt) && n <= (s.ab || 0)) { s.ko = null; s.versiegelt = false; s.ab = null; }
    AN.i = n;
    stand();
  }
  /* Offene Punkte im Entscheid: Schritt, in dem man sie erledigt */
  var OFFEN_SCHRITT = { 'o.rueckruf': 'ident', 'o.hygiene': 'hygiene', 'o.sicher': 'sicher', 'o.sperre': 'sperre', 'o.funktion': 'funktion', 'o.defekt': 'funktion', 'o.kern': 'funktion', 'o.reset': 'reset', 'o.zustand': 'zustand' };
  function zurueck() {
    var s = AN.s;
    LAUF.raus = false;
    if (AN.gate && AN.gate.sp) { delete AN.gate.sp; delete AN.gate.spAng; }          // aus «Später reparieren» zurück zur Reparaturfrage
    else if (AN.gate) AN.gate = null;
    else if (AN.nachMm) return;
    else if (s.ko || s.versiegelt) { AN.i = s.ab || 0; s.ko = null; s.versiegelt = false; s.ab = null; }
    else AN.i--;
    stand();
  }

  }
  function raus() { LAUF.raus = !LAUF.raus; zeichneSchritt(); if (LAUF.raus) $('raus-grund').focus(); }
  function rausOk() { var g = $('raus-grund').value.trim(); if (g) ko('frei', g); else $('raus-grund').focus(); }
